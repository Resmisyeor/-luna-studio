<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6' fill='%230a1216'/%3E%3Cpath d='M16 3C10.5 4 7 8.6 7 14c0 6.1 4.9 11 11 11 2 0 3.9-.5 5.5-1.5C20 24.6 16.5 20.7 16.5 16c0-4.7 2.9-8.7 6.5-9.8C21.4 4.3 18.8 3.2 16 3Z' fill='%23f4cf8a'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a1216">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Plus+Jakarta+Sans:wght@200..800&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Courier+Prime:wght@400;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;700&family=Caveat:wght@500;600;700&display=swap');

  :root{
    --void: #14110c;
    --ink: #1a1610;
    --panel: #221c14;
    --panel-2: #2a2318;
    --line: #3c3324;
    --silver: #efe4cd;
    --silver-dim: #a8987a;
    --accent: #bf4a3d;
    --accent-dim: #5f342d;
    --gold: #c8a15c;
    --danger: #d9645a;
    --ok: #82a86e;
    --editor-font: 'Plus Jakarta Sans', sans-serif;
  }

  body[data-theme="sakura"]{
    --void:#1a1113; --ink:#211318; --panel:#2c1a1f; --panel-2:#341f26; --line:#452b31;
    --silver:#f6e7e1; --silver-dim:#b9928e; --accent:#c9636e; --accent-dim:#6b3a3e;
    --gold:#d9a26a; --danger:#e2645c; --ok:#8fae7f;
  }
  body[data-theme="forest"]{
    --void:#0f1410; --ink:#141a15; --panel:#1c241c; --panel-2:#222c22; --line:#33402f;
    --silver:#e8ecdc; --silver-dim:#93a68d; --accent:#749b58; --accent-dim:#41522e;
    --gold:#c2a95a; --danger:#d9767a; --ok:#8fbf7f;
  }
  body[data-theme="parchment"]{
    --void:#ece2c9; --ink:#e3d7b9; --panel:#f4ecd7; --panel-2:#e9dec0; --line:#cab98a;
    --silver:#2c2414; --silver-dim:#6c5f42; --accent:#a03f2e; --accent-dim:#d8bd8e;
    --gold:#886529; --danger:#a03f2e; --ok:#4f7a48;
  }
  body[data-theme="midnight"]{
    --void:#0a0e1a; --ink:#0e1422; --panel:#141b2e; --panel-2:#1a2338; --line:#28324a;
    --silver:#e4ebf5; --silver-dim:#8b98b8; --accent:#5b8fe0; --accent-dim:#33456e;
    --gold:#e0c15b; --danger:#e0715b; --ok:#6ecf9a;
  }
  body[data-theme="cinema"]{
    --void:#000000; --ink:#0a0a0a; --panel:#141414; --panel-2:#1d1d1d; --line:#2b2b2b;
    --silver:#f5f5f1; --silver-dim:#a6a6a6; --accent:#e50914; --accent-dim:#7a0a10;
    --gold:#f5c518; --danger:#ff5a5f; --ok:#46d369;
  }
  body[data-theme="amber"]{
    --void:#160f08; --ink:#1d150c; --panel:#271c10; --panel-2:#302313; --line:#463319;
    --silver:#f3e6ce; --silver-dim:#b39a6f; --accent:#e08a3c; --accent-dim:#6e4a20;
    --gold:#f0b94f; --danger:#d9645a; --ok:#8fbf6a;
  }

  /* ============ QUIET / NO-MOTION MODE ============ */
  body.no-motion,
  body.no-motion *,
  body.no-motion *::before,
  body.no-motion *::after{
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; overscroll-behavior-x:none;}
  body{
    margin:0;
    background:var(--void);
    color:var(--silver);
    font-family:'Plus Jakarta Sans', sans-serif;
    overflow:hidden;
    overscroll-behavior-x:none;
    transition:background .2s, color .2s;
  }
  ::selection{ background:var(--accent-dim); color:var(--silver); }

  .app{ display:flex; height:100vh; height:100dvh; }

  .sidebar{
    width:290px; min-width:290px;
    background:var(--ink);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    position:relative;
    touch-action:pan-y;
  }
  .sidebar::before{
    content:''; position:absolute; top:0; right:-1px; width:1px; height:100%;
    background:linear-gradient(180deg, var(--accent-dim), transparent 60%);
    opacity:.6;
  }
  .brand{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .brand-row{ display:flex; align-items:center; gap:11px; }
  .brand-icon{
    flex-shrink:0; width:36px; height:36px; border-radius:3px;
    background:linear-gradient(150deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.1; }
  .brand-text .b1{
    font-family:'Bricolage Grotesque', serif; font-weight:600; font-style:italic;
    font-size:21px; letter-spacing:0.01em; color:var(--silver);
  }
  .brand-text .b2{
    font-size:10px; letter-spacing:0.14em; color:var(--silver-dim); margin-top:2px;
  }
  .theme-row{ display:flex; align-items:center; gap:7px; margin-top:15px; flex-wrap:wrap; }
  .theme-swatch{
    width:19px; height:19px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; padding:0;
  }
  .theme-swatch.active{ border-color:var(--silver); }
  .theme-swatch.t-luna{ background:linear-gradient(135deg,#bf4a3d,#14110c); }
  .theme-swatch.t-sakura{ background:linear-gradient(135deg,#c9636e,#1a1113); }
  .theme-swatch.t-forest{ background:linear-gradient(135deg,#749b58,#0f1410); }
  .theme-swatch.t-parchment{ background:linear-gradient(135deg,#a03f2e,#ece2c9); }
  .theme-swatch.t-midnight{ background:linear-gradient(135deg,#5b8fe0,#0a0e1a); }
  .theme-swatch.t-cinema{ background:linear-gradient(135deg,#e50914,#000); }
  .theme-swatch.t-amber{ background:linear-gradient(135deg,#e08a3c,#160f08); }

  .motion-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
  }
  .motion-label{ font-size:11px; color:var(--silver-dim); }
  .motion-switch{
    position:relative; width:32px; height:18px; border-radius:20px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line); flex-shrink:0;
  }
  .motion-switch .knob{
    position:absolute; top:1px; left:1px; width:14px; height:14px; border-radius:50%;
    background:var(--silver-dim); transition:transform .18s ease, background .18s ease;
  }
  .motion-switch.on{ border-color:var(--accent-dim); }
  .motion-switch.on .knob{ transform:translateX(14px); background:var(--accent); }
  .bg-anim-select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--silver);
    font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; border-radius:3px;
    padding:4px 6px; cursor:pointer;
  }
  .account-email{ font-size:11px; color:var(--silver-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
  .account-link{ background:none; border:none; color:var(--gold); font-size:11px; cursor:pointer; text-decoration:underline; font-family:'Plus Jakarta Sans',sans-serif; padding:0; flex-shrink:0; }


  .tree-wrap{ flex:1; overflow-y:auto; padding:14px 10px 10px; min-height:0; -webkit-overflow-scrolling:touch; touch-action:pan-y; overflow-anchor:none; }
  .tree-wrap::-webkit-scrollbar{ width:6px; }
  .tree-wrap::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .new-series-btn{
    width:100%; margin:0 0 12px 0; display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dim));
    border:none; color:var(--silver); border-radius:3px;
    padding:10px 12px; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:600;
    cursor:pointer; text-align:left; box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .new-series-btn:hover{ filter:brightness(1.1); box-shadow:0 4px 14px rgba(0,0,0,.3); }
  .new-series-btn .plus{ font-size:15px; line-height:1; }

  .series-block{ margin-bottom:8px; border-radius:3px; animation:item-in .25s ease; }
  .series-head{
    display:flex; align-items:center; gap:8px;
    padding:8px 8px; border-radius:3px; cursor:pointer; user-select:none;
    background:var(--panel);
  }
  .series-head:hover{ filter:brightness(1.15); }
  .series-chevron{
    width:9px; height:9px; flex-shrink:0;
    border-right:1.5px solid var(--gold); border-bottom:1.5px solid var(--gold);
    transform:rotate(-45deg); transition:transform .15s; margin-left:2px;
  }
  .series-block.open .series-chevron{ transform:rotate(45deg); }
  .series-title{
    flex:1; font-weight:700; color:var(--gold);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-family:'Bricolage Grotesque', serif; letter-spacing:0.01em; font-size:15.5px;
  }
  .series-count{ font-size:10px; color:var(--silver-dim); }
  .series-del{
    opacity:.5; width:22px; height:22px; border:none; background:none;
    color:var(--silver-dim); cursor:pointer; font-size:14px; line-height:1; border-radius:4px;
    flex-shrink:0; transition:opacity .15s ease, color .15s ease, background .15s ease;
  }
  .series-head:hover .series-del{ opacity:1; }
  .series-del:hover{ color:var(--danger); background:rgba(0,0,0,.15); }

  .series-body{ display:none; padding:8px 0 4px 10px; }
  .series-block.open .series-body{ display:block; }

  .new-season-btn{
    width:100%; margin:6px 0 6px 0;
    background:none; border:1px dashed var(--line);
    color:var(--silver-dim); border-radius:3px;
    padding:7px 9px; font-family:'Plus Jakarta Sans',sans-serif; font-size:12px;
    cursor:pointer; text-align:left; transition:border-color .15s, color .15s;
  }
  .new-season-btn:hover{ border-color:var(--accent); color:var(--silver); }

  .season{ margin-bottom:2px; animation:item-in .25s ease; }
  @keyframes item-in{
    from{ opacity:0; transform:translateX(-4px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .season-head{
    display:flex; align-items:center; gap:8px;
    padding:7px 8px; border-radius:3px; cursor:pointer; user-select:none;
  }
  .season-head:hover{ background:var(--panel); }
  .season-chevron{
    width:8px; height:8px; flex-shrink:0;
    border-right:1.5px solid var(--silver-dim); border-bottom:1.5px solid var(--silver-dim);
    transform:rotate(-45deg); transition:transform .15s; margin-left:2px;
  }
  .season.open .season-chevron{ transform:rotate(45deg); }
  .season-title{
    flex:1; font-size:13px; font-weight:600; color:var(--silver);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .season-count{ font-size:10.5px; color:var(--silver-dim); }
  .season-del{
    opacity:.5; width:22px; height:22px; border:none; background:none;
    color:var(--silver-dim); cursor:pointer; font-size:13px; line-height:1; border-radius:4px;
    flex-shrink:0; transition:opacity .15s ease, color .15s ease, background .15s ease;
  }
  .season-head:hover .season-del{ opacity:1; }
  .season-del:hover{ color:var(--danger); background:rgba(0,0,0,.15); }

  .episodes{ display:none; padding-left:17px; margin-top:2px; }
  .season.open .episodes{ display:block; }

  .episode{
    display:flex; align-items:center; gap:7px;
    padding:6px 8px; border-radius:3px; cursor:pointer;
    font-size:12.5px; color:var(--silver-dim);
    border-left:1px solid var(--line); margin-left:2px;
    animation:item-in .25s ease;
  }
  .episode:hover{ background:var(--panel); color:var(--silver); transform:translateX(2px); }
  .episode.active{ background:var(--panel-2); color:var(--gold); border-left-color:var(--accent); }
  .ep-status-dot{
    width:8px; height:8px; border-radius:50%; flex-shrink:0; cursor:pointer;
    border:1.5px solid var(--silver-dim); background:none;
  }
  .ep-status-dot.done{ background:var(--ok); border-color:var(--ok); }
  .episode-name{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .episode-del{
    opacity:.5; width:20px; height:20px; border:none; background:none;
    color:var(--silver-dim); cursor:pointer; font-size:12px; line-height:1; border-radius:4px;
    flex-shrink:0; transition:opacity .15s ease, color .15s ease, background .15s ease;
  }
  .episode:hover .episode-del{ opacity:1; }
  .episode-del:hover{ color:var(--danger); background:rgba(0,0,0,.15); }

  .new-episode-btn{
    margin:2px 0 6px 19px;
    background:none; border:none; color:var(--accent);
    font-size:11.5px; cursor:pointer; padding:5px 8px;
    opacity:.85;
  }
  .new-episode-btn:hover{ opacity:1; text-decoration:underline; }

  .sidebar-footer-wrap{ border-top:1px solid var(--line); }
  .sidebar-footer-wrap .motion-row{
    margin-top:0; padding:9px 18px; border-top:none; border-bottom:1px solid var(--line);
  }
  .sidebar-footer{
    padding:11px 18px;
    font-size:10.5px; color:var(--silver-dim); display:flex; justify-content:space-between; align-items:center;
  }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:5px; transition:background .2s; }
  .save-dot.saving{ background:var(--gold); animation:save-pulse .9s ease-in-out infinite; }
  @keyframes save-pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.6); opacity:.55; }
  }

  .main{ flex:1; display:flex; flex-direction:column; height:100vh; height:100dvh; min-width:0; min-height:0; }
  #mainContent{ display:flex; flex-direction:column; flex:1; min-height:0; }

  .topbar{
    padding:16px 32px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px;
  }
  .crumb{ font-size:11px; color:var(--silver-dim); white-space:nowrap; }
  .ep-title-input{
    background:none; border:none; outline:none;
    font-family:'Bricolage Grotesque', serif; font-weight:600;
    font-size:26px; color:var(--silver); flex:1; min-width:0;
  }
  .ep-title-input::placeholder{ color:var(--silver-dim); }
  .ep-meta{ font-size:12px; color:var(--silver-dim); white-space:nowrap; }

  .status-toggle{
    display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; flex-shrink:0;
  }
  .status-opt{
    padding:5px 12px; font-size:11px; cursor:pointer; background:none; border:none;
    color:var(--silver-dim); font-family:'Plus Jakarta Sans',sans-serif;
  }
  .status-opt.active.devam{ background:var(--accent-dim); color:var(--silver); }
  .status-opt.active.bitti{ background:var(--ok); color:var(--void); }

  .save-pill{
    font-size:11px; color:var(--ok); border:1px solid var(--accent-dim);
    padding:4px 10px; border-radius:3px; white-space:nowrap;
    transition:color .2s, border-color .2s;
  }
  .save-pill.saving{ color:var(--gold); }

  .tabs{
    display:flex; gap:2px; padding:0 32px; border-bottom:1px solid var(--line);
    background:var(--ink);
  }
  .tab{
    padding:10px 16px; font-size:12.5px; color:var(--silver-dim);
    cursor:pointer; border-bottom:2px solid transparent; user-select:none;
  }
  .tab:hover{ color:var(--silver); }
  .tab{ position:relative; }
  .tab.active{ color:var(--gold); border-bottom-color:var(--gold); }
  .tab.active::after{
    content:''; position:absolute; left:12px; right:12px; bottom:-2px; height:2px;
    background:var(--gold); animation:tab-underline .25s ease;
  }
  @keyframes tab-underline{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }

  .panes{ flex:1; overflow:hidden; position:relative; min-height:0; }
  .pane{ display:none; height:100%; }
  .pane.active{ display:flex; flex-direction:column; animation:pane-in .3s ease; min-height:0; }
  @keyframes pane-in{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .editor-scroll{ flex:1; overflow-y:auto; padding:28px 0; min-height:0; -webkit-overflow-scrolling:touch; touch-action:pan-y; overflow-anchor:none; }
  .editor-scroll::-webkit-scrollbar{ width:8px; }
  .editor-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .editor-inner{ max-width:720px; margin:0 auto; padding:0 32px; }

  .format-bar{
    display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; align-items:center;
  }
  .fmt-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--silver-dim);
    font-size:11.5px; padding:6px 11px; border-radius:3px; cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .fmt-btn:hover{ color:var(--silver); border-color:var(--accent-dim); }
  .font-select{
    background:var(--panel); border:1px solid var(--line); color:var(--silver);
    font-size:11.5px; padding:6px 9px; border-radius:3px; cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .spell-toggle{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--silver-dim); cursor:pointer; user-select:none;
  }
  .spell-toggle input{ accent-color:var(--accent); }

  .color-bar{
    display:flex; align-items:center; gap:7px; margin-bottom:16px; flex-wrap:wrap;
    padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .color-bar-label{ font-size:11.5px; color:var(--silver-dim); margin-right:2px; }
  .color-swatch{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line);
    cursor:pointer; padding:0; transition:transform .12s ease, border-color .12s ease;
  }
  .color-swatch:hover{ transform:scale(1.2); border-color:var(--silver); }
  .color-custom{
    width:24px; height:24px; padding:0; border:1.5px solid var(--line); border-radius:50%;
    background:none; cursor:pointer; overflow:hidden;
  }
  .color-custom::-webkit-color-swatch-wrapper{ padding:0; border-radius:50%; }
  .color-custom::-webkit-color-swatch{ border:none; border-radius:50%; }

  #editor{
    width:100%; min-height:60vh; background:none; border:none; outline:none;
    color:var(--silver); font-size:16.5px; line-height:1.85;
    font-family:var(--editor-font); white-space:pre-wrap; word-wrap:break-word;
  }
  #editor:empty::before{ content:attr(placeholder); color:var(--silver-dim); pointer-events:none; }

  .editor-footer{
    border-top:1px solid var(--line); padding:14px 32px;
    display:flex; justify-content:space-between; font-size:11.5px; color:var(--silver-dim);
  }

  .notes-pane{ padding:28px 32px; overflow-y:auto; flex:1; min-height:0; -webkit-overflow-scrolling:touch; touch-action:pan-y; overflow-anchor:none; }
  .notes-grid{ max-width:820px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .note-card{ background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:18px; }
  .note-card h3{
    margin:0 0 10px; font-family:'Bricolage Grotesque', serif; font-weight:600;
    font-size:17px; color:var(--gold); font-style:italic;
  }
  .note-card textarea{
    width:100%; min-height:130px; background:none; border:none; outline:none;
    resize:vertical; color:var(--silver-dim); font-size:13.5px; line-height:1.7;
    font-family:var(--editor-font);
  }
  .note-card textarea:focus{ color:var(--silver); }

  .chars-pane, .images-pane{ padding:28px 32px; overflow-y:auto; flex:1; min-height:0; -webkit-overflow-scrolling:touch; touch-action:pan-y; overflow-anchor:none; }
  .chars-inner, .images-inner{ max-width:820px; margin:0 auto; }
  .char-add, .img-add-label{
    display:inline-block;
    background:none; border:1px dashed var(--line); color:var(--silver-dim);
    padding:10px 16px; border-radius:3px; cursor:pointer; font-size:13px; margin-bottom:16px;
  }
  .char-add:hover, .img-add-label:hover{ border-color:var(--accent); color:var(--silver); }
  .char-card{
    background:var(--panel); border:1px solid var(--line); border-radius:3px;
    padding:16px 18px; margin-bottom:12px; display:flex; gap:14px; align-items:flex-start;
  }
  .char-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0; margin-top:2px;
    background:linear-gradient(135deg, var(--accent), var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Bricolage Grotesque', serif; font-weight:600; font-size:16px; color:var(--void);
    overflow:hidden; background-size:cover; background-position:center;
  }
  .char-body{ flex:1; min-width:0; }
  .char-name{
    background:none; border:none; outline:none; width:100%;
    font-size:15px; font-weight:700; color:var(--silver); margin-bottom:6px;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .char-name::placeholder{ font-weight:600; color:var(--silver-dim); }
  .char-desc{
    background:none; border:none; outline:none; width:100%; resize:none;
    color:var(--silver-dim); font-size:13px; line-height:1.6; min-height:20px;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .char-desc:focus{ color:var(--silver); }
  .char-photo-btn{
    font-size:10.5px; color:var(--accent); cursor:pointer; margin-top:6px; display:inline-block;
  }
  .char-del{
    background:none; border:none; color:var(--silver-dim); cursor:pointer;
    font-size:16px; margin-top:2px;
  }
  .char-del:hover{ color:var(--danger); }

  .img-hint{ font-size:11.5px; color:var(--silver-dim); margin-bottom:14px; }
  .img-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:16px; }
  .img-card{ background:var(--panel); border:1px solid var(--line); border-radius:3px; overflow:hidden; }
  .img-card img{ width:100%; height:140px; object-fit:cover; display:block; }
  .img-card-body{ padding:10px 12px; }
  .img-caption{
    width:100%; background:none; border:none; outline:none; color:var(--silver-dim);
    font-size:12px; font-family:'Plus Jakarta Sans',sans-serif;
  }
  .img-caption:focus{ color:var(--silver); }
  .img-del{
    background:none; border:none; color:var(--silver-dim); cursor:pointer; font-size:12px;
    float:right;
  }
  .img-del:hover{ color:var(--danger); }

  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--silver-dim); text-align:center; padding:40px;
  }
  .empty-state .moon-icon{ margin-bottom:18px; opacity:.5; }
  .empty-state h2{
    font-family:'Bricolage Grotesque', serif; font-weight:500; font-style:italic;
    color:var(--silver); font-size:22px; margin:0 0 8px;
  }
  .empty-state p{ font-size:13.5px; max-width:340px; line-height:1.6; margin:0; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--accent-dim); color:var(--silver);
    padding:10px 18px; border-radius:3px; font-size:12.5px; opacity:0;
    transition:opacity .25s, transform .25s; pointer-events:none; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ============ AMBIENT BACKGROUND (seçilebilir) ============ */
  .bg-ambience{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    contain:strict; will-change:auto;
  }
  .bg-orb{ display:none; }
  .bg-stars{ position:absolute; inset:0; opacity:0; }
  .bg-star{ position:absolute; width:2px; height:2px; border-radius:50%; opacity:0; }
  .bg-sweep{ display:none; }

  /* --- Kapalı --- */
  body[data-bg-anim="off"] .bg-ambience{ display:none; }

  /* --- Mürekkep benekleri (parlak) --- */
  body[data-bg-anim="dots"] .bg-stars{ opacity:.85; mix-blend-mode:normal; }
  body[data-bg-anim="dots"] .bg-star{
    width:2.5px; height:2.5px; background:var(--gold);
    animation:fleck 5s ease-in-out infinite;
  }
  @keyframes fleck{
    0%,100%{ opacity:0; transform:scale(.7); }
    50%{ opacity:1; transform:scale(1.5); }
  }

  /* --- Yumuşak parıltı (belirgin) --- */
  body[data-bg-anim="glow"] .bg-orb{
    display:block; position:absolute; border-radius:50%; filter:blur(80px);
    animation:orb-float 26s ease-in-out infinite;
  }
  body[data-bg-anim="glow"] .bg-orb.o1{ width:520px; height:520px; background:var(--accent); opacity:.4; top:-160px; right:-120px; animation-duration:30s; }
  body[data-bg-anim="glow"] .bg-orb.o2{ width:380px; height:380px; background:var(--gold); opacity:.3; bottom:-130px; left:-90px; animation-duration:36s; animation-direction:reverse; }
  body[data-bg-anim="glow"] .bg-orb.o3{ width:300px; height:300px; background:var(--gold); opacity:.22; bottom:22%; right:14%; animation-duration:22s; }
  @keyframes orb-float{
    0%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(34px,-40px) scale(1.1); }
    100%{ transform:translate(0,0) scale(1); }
  }

  /* --- Yükselen parçacıklar --- */
  body[data-bg-anim="rise"] .bg-stars{ opacity:.9; }
  body[data-bg-anim="rise"] .bg-star{
    width:3px; height:3px; background:var(--gold);
    top:auto !important; bottom:-10px;
    animation:rise 8s linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    12%{ opacity:.9; }
    88%{ opacity:.5; }
    100%{ transform:translateY(-105vh) translateX(16px); opacity:0; }
  }

  /* --- Kayan ışık --- */
  body[data-bg-anim="sweep"] .bg-sweep{
    display:block; position:absolute; inset:-50%; width:200%; height:200%;
    background:linear-gradient(115deg, transparent 40%, color-mix(in srgb, var(--gold) 22%, transparent) 50%, transparent 60%);
    animation:sweep 7s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{ transform:translateX(-30%) translateY(-10%); }
    50%{ transform:translateX(10%) translateY(10%); }
  }

  body[data-theme="parchment"] .bg-star{ background:var(--accent); }

  .app{ position:relative; z-index:1; }

  /* ============ VERSION BADGE ============ */
  .version-badge{
    position:fixed; bottom:14px; right:16px; z-index:40;
    font-size:10.5px; letter-spacing:.04em; color:var(--silver-dim);
    background:var(--panel); border:1px solid var(--line); border-radius:3px;
    padding:5px 12px; display:flex; align-items:center; gap:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .version-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); }

  /* ============ SPLASH / INTRO ============ */
  .splash{
    position:fixed; inset:0; z-index:100;
    background:var(--void);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .6s ease, visibility .6s ease;
  }
  .splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .splash-moon{
    width:64px; height:64px; margin-bottom:22px;
    animation:splash-pulse 2.2s ease-in-out infinite;
  }
  @keyframes splash-pulse{
    0%,100%{ filter:drop-shadow(0 0 5px rgba(200,161,92,.3)); transform:scale(1); }
    50%{ filter:drop-shadow(0 0 16px rgba(200,161,92,.6)); transform:scale(1.04); }
  }
  .splash-title{
    font-family:'Bricolage Grotesque', serif; font-weight:600; font-style:italic;
    font-size:34px; color:var(--silver); letter-spacing:.02em;
    opacity:0; animation:splash-fade-up .9s ease .3s forwards;
  }
  .splash-sub{
    font-size:11px; letter-spacing:.24em; color:var(--silver-dim); margin-top:10px;
    opacity:0; animation:splash-fade-up .9s ease .55s forwards;
  }
  @keyframes splash-fade-up{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .splash-bar{
    width:180px; height:2px; background:var(--line); border-radius:2px; margin-top:28px; overflow:hidden;
    opacity:0; animation:splash-fade-up .9s ease .7s forwards;
  }
  .splash-bar-fill{
    height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--gold));
    animation:splash-load 1.3s ease .8s forwards;
  }
  @keyframes splash-load{ to{ width:100%; } }

  /* ============ AUTH SCREEN ============ */
  .auth-screen{
    position:fixed; inset:0; z-index:105; display:none;
    align-items:center; justify-content:center;
    background:var(--void);
  }
  .auth-screen.show{ display:flex; }
  .auth-card{
    width:320px; max-width:88vw; display:flex; flex-direction:column; align-items:center;
    text-align:center; gap:9px;
  }
  .auth-moon{ width:34px; height:34px; margin-bottom:4px; }
  .auth-title{ font-family:'Bricolage Grotesque',serif; font-weight:600; font-style:italic; font-size:24px; color:var(--silver); }
  .auth-sub{ font-size:12px; color:var(--silver-dim); margin-bottom:10px; line-height:1.4; }
  .auth-input{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--silver);
    border-radius:3px; padding:10px 12px; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px;
  }
  .auth-input:focus{ outline:none; border-color:var(--accent-dim); }
  .auth-error{ color:var(--danger); font-size:11.5px; min-height:14px; }
  .auth-btn{
    width:100%; padding:10px 12px; border-radius:3px; font-family:'Plus Jakarta Sans',sans-serif;
    font-size:13px; font-weight:600; cursor:pointer; border:none;
  }
  .auth-btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-dim)); color:var(--silver); }
  .auth-btn-primary:hover{ filter:brightness(1.1); }
  .auth-btn-secondary{ background:var(--panel-2); border:1px solid var(--line); color:var(--silver); }
  .auth-btn-secondary:hover{ border-color:var(--gold); }
  .auth-divider{ font-size:10.5px; color:var(--silver-dim); margin:2px 0; }
  .auth-btn-ghost{ background:transparent; color:var(--silver-dim); text-decoration:underline; }
  .auth-btn-ghost:hover{ color:var(--silver); }

  /* ============ REFINED BUTTONS ============ */
  .new-series-btn, .new-season-btn, .new-episode-btn, .fmt-btn, .char-add, .img-add-label,
  .exportBtn, #exportBtn{
    transition:transform .12s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .new-series-btn:active, .fmt-btn:active, .char-add:active, .img-add-label:active{
    transform:scale(.97);
  }
  .new-series-btn{
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .new-series-btn:hover{
    background:var(--panel-2);
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  #exportBtn{
    background:linear-gradient(135deg, var(--accent), var(--accent-dim));
    color:var(--silver); border:none; font-weight:600;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  #exportBtn:hover{ filter:brightness(1.12); box-shadow:0 5px 16px rgba(0,0,0,.35); }
  #exportBtn:active{ transform:scale(.96); }
  .status-toggle{ box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .status-opt{ transition:background .15s ease, color .15s ease; cursor:pointer; }
  .save-pill{ box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .theme-swatch{ transition:transform .15s ease, border-color .15s ease; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .theme-swatch:hover{ transform:scale(1.15); }
  .episode{ transition:background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
  .fmt-btn:hover, .char-add:hover, .img-add-label:hover{ transform:translateY(-1px); }
  .episode.active{ box-shadow:inset 0 0 0 1px var(--accent-dim); }
  .series-head, .season-head{ transition:background .15s ease; }
  .tab{ transition:color .15s ease, border-color .15s ease; }
  .char-card, .img-card, .note-card{ transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
  .char-card:hover, .img-card:hover, .note-card:hover{
    border-color:var(--accent-dim); box-shadow:0 4px 16px rgba(0,0,0,.2); transform:translateY(-2px);
  }
  .ep-status-dot{ transition:transform .15s ease, background .15s ease; }
  .ep-status-dot:hover{ transform:scale(1.25); }

  /* ============ PHONE MODE / RESPONSIVE ============ */
  .menu-toggle{
    display:none; position:relative; z-index:20; flex-direction:column; justify-content:center;
    align-items:center; gap:4px; width:40px; height:40px; margin:12px 0 0 16px; flex-shrink:0;
    background:var(--panel); border:1px solid var(--line); border-radius:3px; cursor:pointer;
    touch-action:manipulation;
  }
  .menu-toggle span{ width:16px; height:1.5px; background:var(--silver); display:block; }
  .sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:59;
  }
  .sidebar-backdrop.show{ display:block; }

  @media (max-width: 820px){
    .menu-toggle{ display:flex; }
    .app{ position:relative; }
    .sidebar{
      position:fixed; top:0; left:0; z-index:60; width:82vw; max-width:320px; min-width:0;
      transform:translateX(-100%); transition:transform .25s ease;
      box-shadow:12px 0 32px rgba(0,0,0,.4);
    }
    .sidebar.open{ transform:translateX(0); }
    .main{ width:100%; }
    .version-badge{ display:none; }
    .topbar{ padding:10px 14px; gap:10px; flex-wrap:wrap; }
    .ep-title-input{ font-size:20px; }
    .ep-meta{ display:none; }
    .status-toggle{ order:3; }
    .tabs{ padding:0 14px; overflow-x:auto; }
    .tabs::-webkit-scrollbar{ display:none; }
    .editor-inner{ padding:0 16px; max-width:100%; }
    .notes-pane, .chars-pane, .images-pane{ padding:20px 16px; }
    .notes-grid{ grid-template-columns:1fr; }
    .img-grid{ grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); }
    .editor-footer{ padding:12px 16px; }
    .char-card{ flex-wrap:wrap; }
  }

  /* ============ LUNA v1.6 — YENİ TASARIM (eski animasyonlar korunur) ============ */
  :root{
    --void:#0a1216; --ink:#0e181d; --panel:#14232a; --panel-2:#1a2d36; --line:#25414c;
    --silver:#e8f1f0; --silver-dim:#86a3a6; --accent:#ff8f6b; --accent-dim:#5a3a30; --gold:#f4cf8a;
    --editor-size:17px;
  }
  body{ background:radial-gradient(900px 500px at 90% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%), var(--void); }
  .app{ padding:14px; gap:14px; }
  .sidebar, .main{ height:calc(100dvh - 28px); background:var(--ink); border:1px solid var(--line); border-radius:22px; overflow:hidden; }
  .sidebar::before{ display:none; }
  .empty-state{ height:100% !important; }
  .brand{ border-bottom:none; padding:20px 20px 10px; }
  .brand-icon{ border-radius:13px; width:40px; height:40px; }
  .brand-text .b1, .splash-title, .auth-title, .empty-state h2, .note-card h3{ font-style:normal; font-weight:700; letter-spacing:-.02em; }
  .brand-text .b1{ font-size:22px; }
  .series-title{ color:var(--silver); font-weight:700; letter-spacing:-.01em; }
  .series-head, .season-head, .episode, .new-series-btn, .new-season-btn, .new-episode-btn, .fmt-btn, .font-select,
  .bg-anim-select, .char-add, .img-add-label, .auth-input, .auth-btn, .toast, .version-badge, .menu-toggle{ border-radius:12px; }
  .status-toggle, .save-pill{ border-radius:999px; }
  .status-opt{ padding:6px 14px; }
  .series-head{ background:var(--panel); }
  .episode{ border-left:none; margin-left:0; }
  .episode.active{ background:var(--accent); color:var(--void); font-weight:600; box-shadow:none; }
  .episode.active .episode-del, .episode.active .episode-half{ color:var(--void); }
  .episode.half{ margin-left:16px; font-size:12px; border-left:1.5px dashed var(--line); border-radius:0 12px 12px 0; }
  .episode-half{ opacity:.5; min-width:22px; height:20px; border:none; background:none; color:var(--silver-dim); cursor:pointer; font-size:13px; border-radius:6px; flex-shrink:0; transition:opacity .15s, color .15s; }
  .episode:hover .episode-half{ opacity:1; }
  .episode-half:hover{ color:var(--accent); background:rgba(0,0,0,.15); }
  .new-episode-btn.half{ margin-top:-4px; color:var(--gold); }
  .new-series-btn, #exportBtn, .auth-btn-primary{ background:var(--accent); color:var(--void); box-shadow:none; }
  .new-series-btn:hover, #exportBtn:hover, .auth-btn-primary:hover{ background:var(--accent); filter:brightness(1.1); }
  .topbar{ padding:22px 34px 12px; border-bottom:none; }
  .ep-title-input{ font-size:30px; font-weight:700; letter-spacing:-.025em; }
  .crumb{ font-size:12px; font-weight:500; }
  .tabs{ background:none; border-bottom:1px solid var(--line); padding:0 34px 12px; gap:6px; }
  .tab{ border-radius:999px; border-bottom:0; padding:7px 16px; }
  .tab.active{ background:var(--panel-2); color:var(--accent); border-bottom-color:transparent; animation:tab-pop .25s ease; }
  .tab.active::after{ display:none; }
  @keyframes tab-pop{ from{ transform:scale(.92); } to{ transform:scale(1); } }
  .note-card, .char-card, .img-card{ border-radius:20px; }
  .note-card h3{ color:var(--accent); font-size:15px; }
  .editor-inner{ max-width:760px; }
  #editor{ font-size:var(--editor-size,17px); line-height:1.9; }
  .auth-card{ width:360px; padding:34px 28px; background:var(--ink); border:1px solid var(--line); border-radius:26px; }
  .splash-title{ font-weight:700; }
  button:focus-visible, select:focus-visible, .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* Odak modu */
  body.zen .sidebar, body.zen .tabs, body.zen .format-bar, body.zen .color-bar, body.zen .menu-toggle,
  body.zen .editor-footer span:last-child, body.zen .version-badge{ display:none !important; }
  body.zen .app{ padding:0; }
  body.zen .main{ height:100dvh; border:none; border-radius:0; }

  @media (max-width: 820px){
    .app{ padding:0; }
    .sidebar{ height:100dvh; border-radius:0 22px 22px 0; }
    .main{ height:100dvh; border:none; border-radius:0; }
    .topbar{ padding:10px 14px; }
    .ep-title-input{ font-size:22px; }
    .tabs{ padding:0 14px 10px; }
  }
  @media (prefers-reduced-motion: reduce){ *, *::before, *::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  /* ============ LUNA v1.7 — CAM (iOS "liquid glass") + 90s + ARKA PLAN GERİ ============ */
  :root{
    --g-bg:color-mix(in srgb,var(--silver) 9%,transparent);
    --g-bd:color-mix(in srgb,var(--silver) 22%,transparent);
    --g-hl:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 16px rgba(255,255,255,.04);
    --g-sh:0 8px 22px rgba(0,0,0,.28);
  }
  /* Paneller artık yarı saydam: arka plan animasyonu görünür (önceki sürümde opak panel onu örtüyordu) */
  .sidebar{ background:color-mix(in srgb,var(--ink) 62%,transparent); border-color:var(--g-bd); box-shadow:var(--g-hl),0 20px 60px rgba(0,0,0,.35); }
  .main{ background:color-mix(in srgb,var(--ink) 42%,transparent); border-color:var(--g-bd); box-shadow:var(--g-hl),0 20px 60px rgba(0,0,0,.35); }
  .topbar,.tabs{ background:none; }

  .new-series-btn,.new-season-btn,.fmt-btn,.font-select,.bg-anim-select,.char-add,.img-add-label,.auth-input,.auth-btn,.status-toggle,.save-pill,.menu-toggle,.version-badge,.toast,.series-head,.note-card,.char-card,.img-card,.motion-switch,#exportBtn,.tab.active{
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03)),var(--g-bg);
    border:1px solid var(--g-bd); color:var(--silver);
    -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%);
    box-shadow:var(--g-hl),var(--g-sh);
  }
  .new-series-btn,.new-season-btn,.fmt-btn,.char-add,.img-add-label,.auth-btn,#exportBtn,.series-head{ transition:transform .15s ease, background .15s ease, box-shadow .15s ease; }
  .new-series-btn:hover,.new-season-btn:hover,.fmt-btn:hover,.char-add:hover,.img-add-label:hover,.auth-btn:hover,#exportBtn:hover,.series-head:hover{
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.07)),var(--g-bg);
    filter:none; transform:translateY(-1px);
    box-shadow:var(--g-hl),0 12px 28px rgba(0,0,0,.34);
  }
  .tab{ background:none; border:1px solid transparent; box-shadow:none; }
  .tab.active{ color:var(--accent); }
  .new-series-btn,#exportBtn,.auth-btn-primary,.episode.active{
    background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.05)),color-mix(in srgb,var(--accent) 52%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 60%,rgba(255,255,255,.35)); color:var(--silver); font-weight:600;
    -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%);
    box-shadow:var(--g-hl),0 8px 22px color-mix(in srgb,var(--accent) 28%,transparent);
  }
  .new-series-btn:hover,#exportBtn:hover,.auth-btn-primary:hover,.episode.active:hover{ background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.08)),color-mix(in srgb,var(--accent) 62%,transparent); }
  .episode.active .episode-del,.episode.active .episode-half{ color:var(--silver); }
  .auth-card{ background:color-mix(in srgb,var(--ink) 55%,transparent); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%); box-shadow:var(--g-hl),0 24px 70px rgba(0,0,0,.45); }
  .auth-btn-ghost{ background:none !important; border:none !important; box-shadow:none !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important; }
  .series-head,.note-card,.char-card,.img-card{ border-radius:18px; }

  .nf-logoimg{ display:block; max-width:min(74vw,340px); max-height:96px; object-fit:contain; filter:drop-shadow(0 6px 18px rgba(0,0,0,.75)); }

  /* üst bölüm: arama üstte; sekmeler + Türler altında */

  /* satır başına dekoratif, kayan arka planlar */
  .nf-row{ position:relative; isolation:isolate; margin:20px 0 0; padding:2px 0 6px; }

  .nf-row::after{ width:62%; aspect-ratio:1; top:-34%; right:-12%; border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 66%); animation:nfDrift 18s ease-in-out infinite alternate; will-change:transform; }
  .nf-row[data-v="0"]{ --rb:linear-gradient(120deg,color-mix(in srgb,var(--accent) 15%,transparent),transparent 58%),radial-gradient(circle at 92% 18%,color-mix(in srgb,var(--gold) 18%,transparent),transparent 42%); }
  .nf-row[data-v="1"]{ --rb:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 10px,transparent 10px 24px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent); }

  .nf-row[data-v="2"]::after{ background:radial-gradient(circle,color-mix(in srgb,var(--gold) 26%,transparent),transparent 66%); animation-duration:15s; }
  .nf-row[data-v="3"]{ --rb:repeating-radial-gradient(circle at 100% 0,rgba(255,255,255,.055) 0 2px,transparent 2px 28px),linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 62%); }

  .nf-row[data-v="4"]{ --rb:conic-gradient(from 210deg at 86% 14%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 30%,color-mix(in srgb,var(--gold) 16%,transparent) 56%,transparent 82%); }

  @media (prefers-reduced-motion:reduce){ .nf-row::after{ animation:none; } }
  .nf-row h3{ margin:14px 18px 0; position:relative; font-size:19px; font-weight:800; }
  .nf-row h3::before{ content:''; width:4px; height:1.05em; border-radius:3px; background:linear-gradient(var(--accent),var(--gold)); align-self:center; flex-shrink:0; }
  @media (min-width:821px){ .nf-row h3{ margin:16px 4vw 0; } .nf-row::before{ inset:0 2vw; } }
  /* okuyucu dil düğmeleri */

  .rd-langs button{ padding:5px 9px; border-radius:9px; border:1px solid var(--g-bd); background:var(--glass); color:var(--silver-dim); font:inherit; font-size:11.5px; font-weight:800; cursor:pointer; }

  /* ============ v6: kompakt vitrin paneli, kart logoları, kapak ayarı, performans ============ */

  /* performans: ağır efektleri azalt */

  .nfp{ background:radial-gradient(900px 420px at 50% -80px,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%),radial-gradient(700px 500px at 100% 40%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%); }
  .nf-row{ margin:16px 0 0; padding:2px 0 6px; position:relative; isolation:isolate; content-visibility:auto; contain-intrinsic-size:auto 320px; --a:color-mix(in srgb,var(--accent) 26%,transparent); --a2:color-mix(in srgb,var(--accent) 12%,transparent); --g:color-mix(in srgb,var(--gold) 20%,transparent); --w:rgba(255,255,255,.05); }

  /* ============ v6.2: yeni Luna Studio açılış animasyonu ============ */

  {id:'parchment', cls:'t-parchment', label:'Parşömen (gündüz)'},
  {id:'midnight', cls:'t-midnight', label:'Gece Mavisi'},
  {id:'amber', cls:'t-amber', label:'Kehribar'},
  {id:'cinema', cls:'t-cinema', label:'Sinema (siyah-kırmızı)'}
];

function uid(){ return 'id' + Math.random().toString(36).slice(2,10); }

/* ================= STORAGE (with safe fallback) ================= */
let storageMode = 'unknown'; // 'cloud' | 'firebase' | 'local'

function fbDocId(){ return currentUser ? currentUser.uid : null; }
function localKey(){ return currentUser ? (STORAGE_KEY + ':' + currentUser.uid) : STORAGE_KEY; }

async function detectStorage(){
  if(window.storage && typeof window.storage.set === 'function'){
    try{
      await window.storage.set('luna-studio:ping', '1');
      storageMode = 'cloud';
      return;
    }catch(e){ /* fall through */ }
  }
  if(fbDb && currentUser){
    storageMode = 'firebase';
    return;
  }
  storageMode = 'local';
}

// Local yazım HER ZAMAN senkron ve anında olur (network'e bağlı değil),
// bu yüzden sekme kapansa/yenilense bile en son hâl asla kaybolmaz.
function writeLocalImmediate(json){
  try{ localStorage.setItem(localKey(), json); }catch(e){ /* yoksay */ }
}
function readLocalTimestamp(json){
  try{ const d = JSON.parse(json); return d && d.updatedAt ? d.updatedAt : 0; }catch(e){ return 0; }
}

async function storageGetProject(){
  const localJson = (()=>{ try{ return localStorage.getItem(localKey()); }catch(e){ return null; } })();
  const localTs = localJson ? readLocalTimestamp(localJson) : 0;

  if(storageMode === 'cloud'){
    try{
      const r = await window.storage.get(STORAGE_KEY);
      const cloudJson = r && r.value ? r.value : null;
      const cloudTs = cloudJson ? readLocalTimestamp(cloudJson) : 0;
      // Hangisi daha yeniyse o kazanır — körü körüne buluta güvenmiyoruz
      if(cloudJson && cloudTs >= localTs) return cloudJson;
      if(localJson){ if(cloudJson) storageSetProject(localJson); return localJson; }
      return cloudJson;
    }catch(e){
      storageMode = (fbDb && currentUser) ? 'firebase' : 'local';
    }
  }
  if(storageMode === 'firebase'){
    try{
      const doc = await fbDb.collection(FB_COLLECTION).doc(fbDocId()).get();
      const cloudJson = (doc.exists && doc.data().json) ? doc.data().json : null;
      const cloudTs = cloudJson ? readLocalTimestamp(cloudJson) : 0;
      if(cloudJson && cloudTs >= localTs){
        writeLocalImmediate(cloudJson);
        return cloudJson;
      }
      if(localJson){
        // Yerelde daha yeni bir sürüm var — buluta bunu geri yaz, eskiyi ezme
        try{ await fbDb.collection(FB_COLLECTION).doc(fbDocId()).set({ json: localJson, updatedAt: Date.now() }); }catch(e){}
        return localJson;
      }
      // Hesap yeni: daha önce misafir modunda bu cihazda kayıt varsa onu içeri aktar
      const guestData = (()=>{ try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; } })();
      if(guestData){
        try{ await fbDb.collection(FB_COLLECTION).doc(fbDocId()).set({ json: guestData, updatedAt: Date.now() }); }catch(e){}
        writeLocalImmediate(guestData);
        return guestData;
      }
      return null;
    }catch(e){
      // internet yoksa yerelden devam et, bağlantı gelince tekrar dener
    }
  }
  return localJson;
}

async function storageSetProject(json){
  writeLocalImmediate(json); // önce her zaman anında yerel kayıt — asıl güvenlik ağı bu
  if(storageMode === 'cloud'){
    try{
      await window.storage.set(STORAGE_KEY, json);
      return true;
    }catch(e){
      storageMode = (fbDb && currentUser) ? 'firebase' : 'local';
    }
  }
  if(storageMode === 'firebase'){
    try{
      await fbDb.collection(FB_COLLECTION).doc(fbDocId()).set({ json, updatedAt: Date.now() });
      return true;
    }catch(e){
      console.error('Firestore kayıt hatası:', e);
      return false; // yerelde zaten kaydedildi ama BULUTA gitmedi — bunu gizleme
    }
  }
  return true;
}


async function loadData(){
  await detectStorage();
  const badge = document.getElementById('versionBadge');
  if(badge){
    const label = storageMode === 'firebase' ? 'Bulut senkron aktif' : storageMode === 'cloud' ? 'Bulut' : 'Bu cihazda kayıtlı';
    badge.innerHTML = `<span class="dot"></span>Luna Studio · v3.4 · ${label}`;
  }
  try{
    const raw = await storageGetProject();
    if(raw) data = JSON.parse(raw);
  }catch(e){ /* start fresh */ }
  if(!data.series) data.series = [];
  data.series.forEach(se=>(se.seasons || []).forEach(x=>(x.episodes || []).forEach(e=>{ delete e.rating; })));
  if(data.seasons && data.seasons.length && data.series.length===0){
    data.series.push({ id: uid(), title: 'Seri 1', open:true, seasons: data.seasons });
    delete data.seasons;
  }
  // migrate episodes missing new fields
  data.series.forEach(ser=>ser.seasons.forEach(s=>s.episodes.forEach(e=>{
    if(!e.status) e.status = 'devam';
    if(!e.images) e.images = [];
    if(!e.characters) e.characters = [];
  })));

  const sc = localStorage.getItem('luna-spellcheck');
  if(sc !== null) spellcheckOn = sc === '1';
  const f = localStorage.getItem('luna-font');
  if(f && FONT_MAP[f]) currentFont = f;
  const th = localStorage.getItem('luna-theme');
  if(th && THEMES.some(t=>t.id===th)) currentTheme = th;
  const nm = localStorage.getItem('luna-motion');
  if(nm !== null) noMotion = nm === '1';
  const ba = localStorage.getItem('luna-bg-anim');
  if(ba) currentBgAnim = ba;

  applyTheme();
  applyFont();
  applyMotion();
  applyBgAnim();
  render();
  dataLoaded = true; // artık save fonksiyonları güvenle çalışabilir
}

async function saveData(){
  if(!dataLoaded) return; // veri henüz yüklenmeden asla kaydetme — boşu buluta yazma riski
  data.updatedAt = Date.now();
  setSaveState(true);
  const ok = await storageSetProject(JSON.stringify(data));
  setSaveState(false);
  if(!ok) flashToast('⚠️ Sadece bu cihazda kaydedildi, buluta senkron OLMADI');
}

function setSaveState(saving){
  const dot = document.getElementById('saveDot');
  const pill = document.getElementById('savePill');
  if(dot) dot.classList.toggle('saving', saving);
  if(pill){
    pill.textContent = saving ? '● kaydediliyor…' : '● kaydedildi';
    pill.classList.toggle('saving', saving);
  }
}

let localTimer = null;
function flushLocal(){
  if(!dataLoaded) return;
  clearTimeout(localTimer); localTimer = null;
  try{ writeLocalImmediate(JSON.stringify(data)); }catch(e){}
}
function scheduleSave(){
  if(!dataLoaded) return;
  data.updatedAt = Date.now();
  clearTimeout(localTimer); localTimer = setTimeout(flushLocal, 700);
  clearTimeout(saveTimer);
  setSaveState(true);
  saveTimer = setTimeout(()=>saveData(), 1500);
}
function saveNow(){
  if(!dataLoaded) return;
  flushLocal();
  clearTimeout(saveTimer);
  saveData();
}
window.addEventListener('pagehide', flushLocal);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushLocal(); });
function flashToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ================= MANUEL YEDEK (indir / yükle) =================
   Bulut senkronu (Firebase) başarısız olsa bile, kullanıcı bu dosyayı
   indirip başka bir cihazda yükleyerek verisini elle taşıyabilir. */
function exportBackup(){
  try{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
    a.href = url;
    a.download = `luna-studio-yedek-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    flashToast('Yedek indirildi');
  }catch(e){ flashToast('Yedek indirilemedi'); }
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ flashToast('Geçersiz yedek dosyası'); return; }
    if(!parsed || !Array.isArray(parsed.series)){ flashToast('Geçersiz yedek dosyası'); return; }
    const ok = confirm(T('Bu yedek, bu cihazdaki mevcut verinin ÜZERİNE yazılacak. Emin misin?'));
    if(!ok) return;
    data = parsed;
    if(!data.series) data.series = [];
  data.series.forEach(se=>(se.seasons || []).forEach(x=>(x.episodes || []).forEach(e=>{ delete e.rating; })));
    data.series.forEach(ser=>ser.seasons.forEach(s=>s.episodes.forEach(e=>{
      if(!e.status) e.status = 'devam';
      if(!e.images) e.images = [];
      if(!e.characters) e.characters = [];
    })));
    currentSeriesId = null; currentSeasonId = null; currentEpisodeId = null;
    dataLoaded = true;
    render();
    saveNow();
    flashToast('Yedek yüklendi ve kaydedildi');
  };
  reader.onerror = ()=> flashToast('Dosya okunamadı');
  reader.readAsText(file);
}
document.getElementById('backupExportBtn').addEventListener('click', exportBackup);
document.getElementById('backupImportBtn').addEventListener('click', ()=>{
  document.getElementById('backupFileInput').click();
});
document.getElementById('backupFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file) importBackupFile(file);
  e.target.value = '';
});

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveNow(); });

window.addEventListener('beforeunload', saveNow);

/* ================= DATA HELPERS ================= */
function getSeries(id){ return data.series.find(s=>s.id===id); }
function getSeason(serId,sId){
  const ser = getSeries(serId);
  return ser ? ser.seasons.find(s=>s.id===sId) : null;
}
function getEpisode(serId,sId,eId){
  const s = getSeason(serId,sId);
  return s ? s.episodes.find(e=>e.id===eId) : null;
}

function addSeries(){
  data.series.push({ id: uid(), title: 'Yeni Seri', open:true, seasons: [], createdAt: Date.now() });
  renderTree(); saveNow();
}
function addSeason(serId){
  const ser = getSeries(serId);
  if(!ser) return;
  ser.seasons.push({ id: uid(), title: 'Yeni Sezon', open:true, episodes: [] });
  renderTree(); saveNow();
}
function addEpisode(serId,sId){
  const s = getSeason(serId,sId);
  if(!s) return;
  const e = { id: uid(), title:'', script:'', status:'devam', createdAt: Date.now(),
    notes:{synopsis:'', worldbuilding:'', outline:'', misc:''}, characters:[], images:[] };
  s.episodes.push(e);
  currentSeriesId = serId; currentSeasonId = sId; currentEpisodeId = e.id;
  s.open = true;
  renderTree(); renderMain(); saveNow();
}
let dragEp = null;
function moveEpisode(s, id, targetId, after){
  const from = s.episodes.findIndex(e=>e.id===id);
  if(from < 0) return;
  const [e] = s.episodes.splice(from, 1);
  let to = s.episodes.findIndex(x=>x.id===targetId);
  if(to < 0) to = s.episodes.length; else if(after) to++;
  s.episodes.splice(to, 0, e);
  renderTree(); renderMain(); saveNow();
}
function stepEpisode(s, id, d){
  const i = s.episodes.findIndex(e=>e.id===id), j = i + d;
  if(i < 0 || j < 0 || j >= s.episodes.length) return;
  [s.episodes[i], s.episodes[j]] = [s.episodes[j], s.episodes[i]];
  renderTree(); renderMain(); saveNow();
}
/* Seri kapağı */
let pendingCoverSeries = null;
function pickSeriesCover(id){ pendingCoverSeries = id; document.getElementById('hiddenSeriesCoverInput').click(); }
function applyCover(){
  const c = document.getElementById('epCover');
  if(!c) return;
  const ser = getSeries(currentSeriesId), u = ser && ser.cover;
  c.style.display = u ? 'block' : 'none';
  if(c.parentElement) c.parentElement.classList.toggle('has-cover', !!u);
  c.style.backgroundImage = u ? 'url("' + u + '")' : 'none';
  c.title = 'Seri kapağı (değiştirmek için tıkla)';
  c.style.cursor = 'pointer';
  c.onclick = ()=>pickSeriesCover(currentSeriesId);
}
/* Numaralandırma: normal bölümler 1,2,3… buçuklar bir öncekinin .5'i (4.5). Aynı bölümden sonra birden fazla buçuk olursa .5, .6, .7… */
function epLabels(season){
  let n = 0, h = 0;
  return season.episodes.map(e=>{
    if(e.half){ h++; return n + '.' + (4 + h); }
    n++; h = 0; return String(n);
  });
}
function addHalfEpisode(serId, sId, afterId){
  const s = getSeason(serId, sId);
  if(!s) return;
  if(!s.episodes.length){ flashToast('Önce bir bölüm ekle'); return; }
  let i = afterId ? s.episodes.findIndex(x=>x.id===afterId) : s.episodes.length - 1;
  if(i < 0) i = s.episodes.length - 1;
  const e = { id: uid(), title:'', script:'', status:'devam', half:true,
    notes:{synopsis:'', worldbuilding:'', outline:'', misc:''}, characters:[], images:[] };
  s.episodes.splice(i + 1, 0, e);
  currentSeriesId = serId; currentSeasonId = sId; currentEpisodeId = e.id;
  currentTab = 'script';
  const ser = getSeries(serId); if(ser) ser.open = true;
  s.open = true;
  renderTree(); renderMain(); saveNow();
  if(window.innerWidth <= 820) closeSidebar();
}
function deleteSeries(serId, ev){
  ev.stopPropagation();
  if(!confirm(T('Bu seri, içindeki tüm sezon ve bölümlerle birlikte silinsin mi?'))) return;
  data.series = data.series.filter(s=>s.id!==serId);
  if(currentSeriesId===serId){ currentSeriesId=null; currentSeasonId=null; currentEpisodeId=null; }
  renderTree(); renderMain(); saveNow();
}
function deleteSeason(serId, sId, ev){
  ev.stopPropagation();
  if(!confirm(T('Bu sezon ve içindeki tüm bölümler silinsin mi?'))) return;
  const ser = getSeries(serId);
  ser.seasons = ser.seasons.filter(s=>s.id!==sId);
  if(currentSeasonId===sId){ currentSeasonId=null; currentEpisodeId=null; }
  renderTree(); renderMain(); saveNow();
}
function deleteEpisode(serId, sId, eId, ev){
  ev.stopPropagation();
  if(!confirm(T('Bu bölüm silinsin mi?'))) return;
  const s = getSeason(serId,sId);
  s.episodes = s.episodes.filter(e=>e.id!==eId);
  if(currentEpisodeId===eId) currentEpisodeId=null;
  renderTree(); renderMain(); saveNow();
}
function selectEpisode(serId, sId, eId){
  saveNow();
  currentSeriesId = serId; currentSeasonId = sId; currentEpisodeId = eId;
  currentTab = 'script';
  try{ localStorage.setItem('luna-last', JSON.stringify({s:serId, se:sId, e:eId})); }catch(_){}
  renderTree(); renderMain();
  if(window.innerWidth <= 820) closeSidebar();
}
function toggleSeries(serId){ const ser=getSeries(serId); ser.open=!ser.open; renderTree(); }
function toggleSeason(serId, sId){ const s=getSeason(serId,sId); s.open=!s.open; renderTree(); }

function toggleEpisodeStatus(serId, sId, eId, ev){
  if(ev) ev.stopPropagation();
  const e = getEpisode(serId, sId, eId);
  e.status = e.status === 'bitti' ? 'devam' : 'bitti';
  renderTree();
  if(currentEpisodeId===eId) renderMain();
  saveNow();
}

/* ================= RENDER: TREE ================= */
function renderTree(){
  const wrap = document.getElementById('seriesList');
  wrap.innerHTML = '';
  let totalEpisodes = 0, totalSeasons = 0, totalDone = 0;
  const q = ((document.getElementById('treeSearch')||{}).value || '').trim().toLowerCase();

  data.series.forEach(ser=>{
    const serBlock = document.createElement('div');
    serBlock.className = 'series-block' + ((ser.open || q) ? ' open':'');
    let serMatch = false;

    const sHead = document.createElement('div');
    sHead.className = 'series-head';
    sHead.onclick = ()=>toggleSeries(ser.id);
    sHead.innerHTML = `
      <span class="series-chevron"></span>
      <span class="series-cover${ser.cover ? ' has' : ''}"><button class="series-cover-btn" title="Seri kapağı ekle / değiştir"></button>${ser.cover ? '<button class="series-cover-x" title="Kapağı kaldır">×</button>' : ''}</span>
      <span class="series-title" contenteditable="true" spellcheck="false"></span>
      ${serTagBadge(ser)}<span class="series-count">${ser.seasons.length}</span>
      <button class="series-del" title="Seriyi sil">✕</button>
    `;
    const serTitleSpan = sHead.querySelector('.series-title');
    serTitleSpan.textContent = ser.title;
    serTitleSpan.onclick = (e)=>e.stopPropagation();
    serTitleSpan.onblur = ()=>{ ser.title = serTitleSpan.textContent.trim() || 'İsimsiz Seri'; renderMain(); saveNow(); };
    serTitleSpan.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); serTitleSpan.blur(); } };
    sHead.querySelector('.series-del').onclick = (ev)=>deleteSeries(ser.id, ev);
    const cbtn = sHead.querySelector('.series-cover-btn');
    if(ser.cover) cbtn.style.backgroundImage = 'url("' + ser.cover + '")'; else cbtn.textContent = '+';
    cbtn.onclick = (ev)=>{ ev.stopPropagation(); pickSeriesCover(ser.id); };
    const cx = sHead.querySelector('.series-cover-x');
    if(cx) cx.onclick = (ev)=>{ ev.stopPropagation(); ser.cover = ''; renderTree(); applyCover(); saveNow(); };
    serBlock.appendChild(sHead);

    const serBody = document.createElement('div');
    serBody.className = 'series-body';

    ser.seasons.forEach(s=>{
      totalSeasons++;
      totalEpisodes += s.episodes.length;
      const seasonEl = document.createElement('div');
      seasonEl.className = 'season' + ((s.open || q) ? ' open':'');

      const doneCount = s.episodes.filter(e=>e.status==='bitti').length;
      totalDone += doneCount;

      const head = document.createElement('div');
      head.className = 'season-head';
      head.onclick = ()=>toggleSeason(ser.id, s.id);
      head.innerHTML = `
        <span class="season-chevron"></span>
        <span class="season-title" contenteditable="true" spellcheck="false"></span>
        ${seasonTagBadge(s)}<span class="season-count">${doneCount}/${s.episodes.length}</span>
        <button class="season-del" title="Sezonu sil">✕</button>
      `;
      const titleSpan = head.querySelector('.season-title');
      titleSpan.textContent = s.title;
      titleSpan.onclick = (e)=>e.stopPropagation();
      titleSpan.onblur = ()=>{ s.title = titleSpan.textContent.trim() || 'İsimsiz Sezon'; renderMain(); saveNow(); };
      titleSpan.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); titleSpan.blur(); } };
      head.querySelector('.season-del').addEventListener('click', (ev)=>{
        ev.stopPropagation();
        deleteSeason(ser.id, s.id, ev);
      });
      seasonEl.appendChild(head);

      const epList = document.createElement('div');
      epList.className = 'episodes';
      const labels = epLabels(s);
      let seasonMatch = false;
      s.episodes.forEach((e,idx)=>{
        if(q){
          const hay = (labels[idx] + ' ' + (e.title || '')).toLowerCase();
          if(!(hay.includes(q) || (q.length >= 3 && stripHtml(e.script).toLowerCase().includes(q)))) return;
          seasonMatch = true;
        }
        const epEl = document.createElement('div');
        epEl.className = 'episode' + (e.half ? ' half':'') + (currentEpisodeId===e.id ? ' active':'');
        epEl.onclick = ()=>selectEpisode(ser.id, s.id, e.id);
        const sub = [e.date ? fmtDate(e.date) : '', e.tag ? `<b class="tg-${e.tag}">${tagLabel(e.tag)}</b>` : ''].filter(Boolean).join(' · ');
        epEl.innerHTML = `
          <button class="ep-status-dot ${e.status==='bitti'?'done':''}" title="${e.status==='bitti'?'Bitti':'Devam ediyor'}"></button>
          <span class="episode-name"><span class="ep-t">${labels[idx]+'. '+escapeHtml(e.title || 'İsimsiz bölüm')}</span>${sub ? '<small class="ep-sub">'+sub+'</small>' : ''}</span>
          ${e.half ? '' : '<button class="episode-half" title="Altına buçuk bölüm ekle (örn. 4.5)">½</button>'}
          <button class="episode-del" title="Sil">✕</button>
        `;
        epEl.querySelector('.ep-status-dot').onclick = (ev)=>toggleEpisodeStatus(ser.id,s.id,e.id,ev);
        epEl.querySelector('.episode-del').onclick = (ev)=>deleteEpisode(ser.id,s.id,e.id,ev);
        epEl.draggable = true;
        epEl.ondragstart = (ev)=>{ dragEp = {sId:s.id, id:e.id}; ev.dataTransfer.effectAllowed = 'move'; try{ ev.dataTransfer.setData('text/plain', e.id); }catch(_){} epEl.classList.add('dragging'); };
        epEl.ondragend = ()=>{ dragEp = null; document.querySelectorAll('.drop-before,.drop-after,.dragging').forEach(x=>x.classList.remove('drop-before','drop-after','dragging')); };
        epEl.ondragover = (ev)=>{
          if(!dragEp || dragEp.sId !== s.id || dragEp.id === e.id) return;
          ev.preventDefault();
          const r = epEl.getBoundingClientRect(), after = ev.clientY > r.top + r.height/2;
          epEl.classList.toggle('drop-after', after); epEl.classList.toggle('drop-before', !after);
        };
        epEl.ondragleave = ()=>epEl.classList.remove('drop-before','drop-after');
        epEl.ondrop = (ev)=>{
          if(!dragEp || dragEp.sId !== s.id) return;
          ev.preventDefault();
          const r = epEl.getBoundingClientRect(), after = ev.clientY > r.top + r.height/2, id = dragEp.id;
          dragEp = null; moveEpisode(s, id, e.id, after);
        };
        const hb = epEl.querySelector('.episode-half');
        if(hb) hb.onclick = (ev)=>{ ev.stopPropagation(); addHalfEpisode(ser.id, s.id, e.id); };
        epList.appendChild(epEl);
      });
      seasonEl.appendChild(epList);

      const addEpBtn = document.createElement('button');
      addEpBtn.className = 'new-episode-btn';
      addEpBtn.textContent = '+ Yeni bölüm';
      addEpBtn.style.display = (s.open && !q) ? 'block' : 'none';
      addEpBtn.onclick = ()=>addEpisode(ser.id, s.id);
      seasonEl.appendChild(addEpBtn);

      const addHalfBtn = document.createElement('button');
      addHalfBtn.className = 'new-episode-btn half';
      addHalfBtn.textContent = '+ Buçuk bölüm (x.5)';
      addHalfBtn.style.display = (s.open && !q) ? 'block' : 'none';
      addHalfBtn.onclick = ()=>addHalfEpisode(ser.id, s.id, null);
      seasonEl.appendChild(addHalfBtn);

      if(!q || seasonMatch){ serBody.appendChild(seasonEl); if(q) serMatch = true; }
    });

    const addSeasonBtn = document.createElement('button');
    addSeasonBtn.className = 'new-season-btn';
    addSeasonBtn.textContent = '+ Yeni sezon';
    addSeasonBtn.onclick = ()=>addSeason(ser.id);
    serBody.appendChild(addSeasonBtn);

    serBlock.appendChild(serBody);
    if(!q || serMatch) wrap.appendChild(serBlock);
  });

  document.getElementById('totalStats').innerHTML =
    `<span class="save-dot" id="saveDot"></span>${data.series.length} seri · ${totalSeasons} sezon · ${totalDone}/${totalEpisodes} bölüm bitti`;
}

      const sel = window.getSelection();
      if(sel && sel.rangeCount){
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(document.createTextNode(text));
        range.collapse(false);

      let n = 0;

        const d = document.createElement('div'); d.innerHTML = h || '';
        const w = document.createTreeWalker(d, NodeFilter.SHOW_TEXT); let x;
        while((x = w.nextNode())){ const c = x.data.split(f).length - 1; if(c){ n += c; x.data = x.data.split(f).join(r); } }

      if(all) ser.seasons.forEach(se=>se.episodes.forEach(e=>{ e.script = doRep(e.script); })); else ep.script = doRep(ep.script);

    nb.onmousedown = (e)=>e.preventDefault();
    nb.onclick = ()=>{ const ta = lastTa || document.querySelector('.note-card textarea'); ta.focus(); const v = ta.value; document.execCommand('insertText', false, (v && !v.endsWith('\n') && ta.selectionStart === v.length ? '\n' : '') + '☐ '); };

  document.querySelectorAll('[data-act]').forEach(b=>{

  const stepFs = (d)=>{
    const cur = parseInt(localStorage.getItem('luna-fsize')) || 17;

const COVER_MAX_MB = 8, COVER_W = 600, COVER_H = 900;
function coverEditor(file, done){
  if(!file || !/^image\//.test(file.type)){ flashToast(T('Lütfen bir görsel seç')); return; }
  if(file.size > COVER_MAX_MB * 1048576){ flashToast(T('Görsel çok büyük (en fazla 8 MB)')); return; }
  const url = URL.createObjectURL(file), im = new Image();
  im.onerror = ()=>{ URL.revokeObjectURL(url); flashToast(T('Lütfen bir görsel seç')); };
  im.onload = ()=>{
    const W = 240, H = 360, iw = im.naturalWidth, ih = im.naturalHeight;
    const base = Math.max(W / iw, H / ih);
    let zoom = 1, ox = 0, oy = 0;
    const el = document.createElement('div'); el.className = 'cv-ed';
    el.innerHTML = '<div class="cv-bg" data-x></div><div class="cv-box" role="dialog" aria-label="Kapağı ayarla"><b>Kapağı ayarla</b><div class="cv-stage"><canvas width="' + W * 2 + '" height="' + H * 2 + '"></canvas></div><small>Sürükleyerek konumlandır, kaydırıcıyla yakınlaştır</small><label class="cv-z"><span>Yakınlaştır</span><input type="range" min="1" max="3" step="0.01" value="1"></label><div class="cv-f"><button type="button" class="fmt-btn" data-x>İptal</button><button type="button" class="fmt-btn primary" data-ok>Uygula</button></div></div>';
    const cv = el.querySelector('canvas'), ctx = cv.getContext('2d'), zr = el.querySelector('input');
    const clamp = ()=>{ const mx = Math.max(0, (iw * base * zoom - W) / 2), my = Math.max(0, (ih * base * zoom - H) / 2); ox = Math.min(mx, Math.max(-mx, ox)); oy = Math.min(my, Math.max(-my, oy)); };
    const paint = (c, k)=>{ const x = c.getContext('2d'), sc = base * zoom; x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, (W / 2 + ox - iw * sc / 2) * k, (H / 2 + oy - ih * sc / 2) * k, iw * sc * k, ih * sc * k); };
    const draw = ()=>{ clamp(); paint(cv, 2); };
    let px = null, py = null;
    cv.onpointerdown = (e)=>{ px = e.clientX; py = e.clientY; cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = (e)=>{ if(px === null) return; ox += e.clientX - px; oy += e.clientY - py; px = e.clientX; py = e.clientY; draw(); };
    cv.onpointerup = cv.onpointercancel = ()=>{ px = null; };
    cv.onwheel = (e)=>{ e.preventDefault(); zoom = Math.min(3, Math.max(1, zoom - e.deltaY * .002)); zr.value = zoom; draw(); };
    zr.oninput = ()=>{ zoom = +zr.value; draw(); };
    const close = ()=>{ el.remove(); URL.revokeObjectURL(url); document.removeEventListener('keydown', esc); };
    const esc = (e)=>{ if(e.key === 'Escape') close(); };
    el.onclick = (e)=>{
      if(e.target.closest('[data-x]')) return close();
      if(e.target.closest('[data-ok]')){
        const o = document.createElement('canvas'); o.width = COVER_W; o.height = COVER_H; paint(o, COVER_W / W);
        let q = .86, u = o.toDataURL('image/jpeg', q);
        while(u.length > 260000 && q > .45){ q -= .08; u = o.toDataURL('image/jpeg', q); }
        close(); done(u);
      }
    };
    document.addEventListener('keydown', esc); document.body.appendChild(el); draw();
  };
  im.src = url;
}

const STATES = [['devam','Devam ediyor'],['bitti','Tamamlandı'],['final','Final veriyor'],['finalsezon','Final sezonu'],['ara','Ara verildi'],['birakildi','Bırakıldı']];
function stateBadge(k){ const t = STATES.find(x=>x[0]===k) || STATES[0]; return '<span class="ep-tag tg-' + t[0] + ' st">' + t[1] + '</span>'; }
function serStatus(ser){ if(ser.state && STATES.some(x=>x[0]===ser.state)) return ser.state; const l = ser.seasons.flatMap(x=>x.episodes).slice(-1)[0]; return l && ['final','ara','birakildi'].includes(l.tag) ? l.tag : 'devam'; }

const NEW_MS = 7*864e5;

function logoFromFile(file, cb){
  const r = new FileReader();
  r.onload = ()=>{ const im = new Image(); im.onload = ()=>{
    let k = Math.min(1, 420 / im.width), u = '';
    for(let n = 0; n < 5; n++){ const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); u = c.toDataURL('image/png'); if(u.length < 140000) break; k *= .7; }
    cb(u);
  }; im.src = r.result; };
  r.readAsDataURL(file);
}
function bannerFromFile(file, cb, maxW, maxKB){
  if(!file || !/^image\//.test(file.type)){ flashToast(T('Lütfen bir görsel seç')); return; }
  const url = URL.createObjectURL(file), im = new Image();
  im.onerror = ()=>{ URL.revokeObjectURL(url); flashToast(T('Lütfen bir görsel seç')); };
  im.onload = ()=>{
    const W = maxW || 1920, H = Math.round(W * 9 / 16), iw = im.naturalWidth, ih = im.naturalHeight;
    const k = Math.max(W / iw, H / ih), sw = W / k, sh = H / k;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
    x.drawImage(im, (iw - sw) / 2, (ih - sh) * .3, sw, sh, 0, 0, W, H);
    let q = .9, u = c.toDataURL('image/jpeg', q);
    while(u.length > (maxKB || 380) * 1370 && q > .5){ q -= .06; u = c.toDataURL('image/jpeg', q); }
    URL.revokeObjectURL(url); cb(u);
  };
  im.src = url;
}

const HERO_MS = 12000;
function nfWire(main, onAct){
  const sl = [...main.querySelectorAll('.nf-slide')]; let cur = 0, hold = false, vis = true, io = null;
  const dots = [...main.querySelectorAll('.nf-dots i')];
  const hero = main.querySelector('#hero'), pv = main.querySelector('#hPrev'), nx = main.querySelector('#hNext');
  clearInterval(heroTimer);
  const restart = ()=>{
    clearInterval(heroTimer);
    if(sl.length < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    heroTimer = setInterval(()=>{ if(!document.body.contains(hero)){ clearInterval(heroTimer); if(io) io.disconnect(); return; } if(!document.hidden && !hold && vis) go(cur + 1, true); }, HERO_MS);
  };
  const go = (n, auto)=>{
    cur = (n + sl.length) % sl.length;
    sl.forEach((el, i)=>el.classList.toggle('active', i === cur));
    dots.forEach((d, i)=>d.classList.toggle('on', i === cur));
    if(!auto) restart();
  };
  sl.forEach(el=>el.querySelectorAll('[data-a]').forEach(b=>b.onclick = ()=>onAct(el.dataset.id, b.dataset.a)));
  if(hero && pv){
    pv.onclick = (e)=>{ e.stopPropagation(); go(cur - 1); };
    nx.onclick = (e)=>{ e.stopPropagation(); go(cur + 1); };
    dots.forEach((d, i)=>{ d.onclick = ()=>go(i); });
    let x0 = null, y0 = null;
    hero.onpointerdown = (e)=>{ if(e.target.closest('button')) return; x0 = e.clientX; y0 = e.clientY; hold = true; };
    hero.onpointerup = (e)=>{ if(x0 !== null){ const dx = e.clientX - x0, dy = e.clientY - y0; if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(cur + (dx < 0 ? 1 : -1)); } x0 = null; y0 = null; hold = false; };
    hero.onpointercancel = ()=>{ x0 = null; y0 = null; hold = false; };
    hero.onmouseenter = ()=>{ hold = true; }; hero.onmouseleave = ()=>{ hold = false; };
    hero.onfocusin = ()=>{ hold = true; }; hero.onfocusout = ()=>{ hold = false; };
    if('IntersectionObserver' in window){ io = new IntersectionObserver(es=>{ vis = es[0].isIntersecting; }, {threshold:.25}); io.observe(hero); }
    restart();
  }
  main.querySelectorAll('.nf-wrap').forEach(w=>{ const r = w.querySelector('.nf-rail'); w.querySelector('.l').onclick = ()=>r.scrollBy({left:-r.clientWidth * .85, behavior:'smooth'}); w.querySelector('.r').onclick = ()=>r.scrollBy({left:r.clientWidth * .85, behavior:'smooth'}); });
}

function allChapters(ser){
