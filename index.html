  ser.seasons.forEach(se=>{ const L = epLabels(se); se.episodes.forEach((e,i)=>out.push({se, e, label:L[i]})); });
  return out;
}
function xesc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dlBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function crc32(b){
  let t = crc32.t;
  if(!t){ t = crc32.t = []; for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } }
  let r = -1; for(let i = 0; i < b.length; i++) r = t[(r ^ b[i]) & 255] ^ (r >>> 8);
  return (r ^ -1) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder(); let off = 0; const chunks = [], cd = [];
  files.forEach(f=>{
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, nm.length, true);
    chunks.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    cd.push(new Uint8Array(c.buffer), nm); off += 30 + nm.length + sz;
  });
  let cdSize = 0; cd.forEach(x=>{ cdSize += x.length; });
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...chunks, ...cd, new Uint8Array(e.buffer)], {type:'application/epub+zip'});
}
function exportEpub(ser){
  const chs = allChapters(ser);
  if(!chs.length){ flashToast(T('Önce bir bölüm ekle')); return; }
  const enc = new TextEncoder(), u8 = (x)=>enc.encode(x), X = '<?xml version="1.0" encoding="utf-8"?>';
  const files = [
    {name:'mimetype', data:u8('application/epub+zip')},
    {name:'META-INF/container.xml', data:u8(X + '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>')},
    {name:'OEBPS/style.css', data:u8('body{font-family:serif;line-height:1.6}h1{text-align:center;margin:1.5em 0}p{margin:0 0 .8em;text-indent:1em}p.sep{text-align:center;text-indent:0}p.gap{height:1em}p.credit{text-align:center;text-indent:0;font-size:.85em;margin:0 0 .3em}')}
  ];
  const items = [], spine = [], nav = [];
  const endHtml = '<p class="sep">' + xesc(T('Bölüm sonu')) + '</p>' + creditLines(ser).map(l=>'<p class="credit">' + xesc(l) + '</p>').join('');
  chs.forEach((c,i)=>{
    const id = 'c' + i, title = c.label + '. ' + (c.e.title || '—');
    const body = scriptLines(c.e.script).map(l=>!l ? '<p class="gap"></p>' : (/^[*＊\s]{3,}$/.test(l) ? '<p class="sep">' + xesc(l) + '</p>' : '<p>' + xesc(l) + '</p>')).join('');
    files.push({name:'OEBPS/' + id + '.xhtml', data:u8(X + '<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><meta charset="utf-8"/><title>' + xesc(title) + '</title><link rel="stylesheet" href="style.css"/></head><body><h1>' + xesc(title) + '</h1>' + body + endHtml + '</body></html>')});
    items.push('<item id="' + id + '" href="' + id + '.xhtml" media-type="application/xhtml+xml"/>');
    spine.push('<itemref idref="' + id + '"/>');
    nav.push('<li><a href="' + id + '.xhtml">' + xesc(c.se.title + ' — ' + title) + '</a></li>');
  });
  files.push({name:'OEBPS/nav.xhtml', data:u8(X + '<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><meta charset="utf-8"/><title>Contents</title></head><body><nav epub:type="toc" id="toc"><ol>' + nav.join('') + '</ol></nav></body></html>')});
  let cover = '';
  const m = (ser.cover || '').match(/^data:image\/(\w+);base64,(.+)$/);
  if(m){
    const bin = atob(m[2]), arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const ext = m[1] === 'jpeg' ? 'jpg' : m[1];
    files.push({name:'OEBPS/cover.' + ext, data:arr});
    cover = '<item id="cover" href="cover.' + ext + '" media-type="image/' + m[1] + '" properties="cover-image"/>';
  }
  const metaExtra = (ser.copyright ? '<dc:publisher>' + xesc(ser.copyright) + '</dc:publisher><dc:rights>' + xesc(ser.copyright) + '</dc:rights>' : '') + (ser.synopsis ? '<dc:description>' + xesc(ser.synopsis) + '</dc:description>' : '') + String(ser.genres || '').split(',').map(g=>g.trim()).filter(Boolean).map(g=>'<dc:subject>' + xesc(g) + '</dc:subject>').join('');
  files.push({name:'OEBPS/content.opf', data:u8(X + '<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="uid">luna-' + ser.id + '</dc:identifier><dc:title>' + xesc(ser.title) + '</dc:title><dc:creator>' + xesc(ser.author || 'Unknown') + '</dc:creator><dc:language>' + LANG + '</dc:language>' + metaExtra + '<meta property="dcterms:modified">' + new Date().toISOString().replace(/\.\d+Z$/, 'Z') + '</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="css" href="style.css" media-type="text/css"/>' + cover + items.join('') + '</manifest><spine>' + spine.join('') + '</spine></package>')});
  dlBlob(zipStore(files), (ser.title || 'series').replace(/[\\/:*?"<>|]/g, '') + '.epub');
}
function closeOverlays(){ document.querySelectorAll('.reader,.modal-back').forEach(x=>x.remove()); }
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeOverlays(); });
let transLang = '';
function renderTrans(ep){
  const box = document.getElementById('transInner'); if(!box) return;
  const ser = getSeries(currentSeriesId); if(!ser) return;
  const orig = serOrig(ser), langs = (ser.langs || []).filter(l=>l !== orig);
  if(!langs.length){
    box.innerHTML = '<div class="trans-empty"><p>Bu seri için çeviri dili seçilmedi. Önce hangi dillerde okunacağını seç.</p><button class="fmt-btn" id="trGo" type="button">Seri bilgisi → Çeviri dilleri</button></div>';
    box.querySelector('#trGo').onclick = ()=>openSeriesInfo(ser.id); return;
  }
  if(!langs.includes(transLang)) transLang = langs[0];
  const cur = (ep.tr && ep.tr[transLang]) || {title:'', text:''};
  const done = l=>!!(ep.tr && ep.tr[l] && String(ep.tr[l].text || '').trim());
  box.innerHTML = '<div class="trans-chips">' + langs.map(l=>'<button type="button" class="nf-opt' + (l === transLang ? ' on' : '') + '" data-l="' + l + '">' + langCode(l) + ' <i>' + (done(l) ? '✓ ' : '') + langName(l) + '</i></button>').join('') + '</div>'
    + '<div class="si-h">Çeviri başlığı (' + escapeHtml(langName(transLang)) + ')</div><input id="trTitle" class="tr-in" placeholder="' + escapeAttr(ep.title || 'Bölüm başlığı') + '" value="' + escapeAttr(cur.title || '') + '" lang="' + transLang + '">'
    + '<details class="tr-orig"><summary>Orijinal metin (' + escapeHtml(langName(orig)) + ')</summary><div class="tr-origtxt">' + escapeHtml(scriptLines(ep.script).join('\n')) + '</div></details>'
    + '<div class="si-h">Çeviri metni</div><textarea id="trText" class="tr-ta" rows="16" spellcheck="' + spellcheckOn + '" lang="' + transLang + '" placeholder="Çeviriyi buraya yaz. Boş satır paragraf arasıdır.">' + escapeHtml(cur.text || '') + '</textarea>'
    + '<div class="tr-foot"><span id="trWc"></span><button class="fmt-btn" id="trCopy" type="button">Orijinali kopyala</button></div>';
  const ti = box.querySelector('#trTitle'), tx = box.querySelector('#trText'), wc = box.querySelector('#trWc');
  const upd = ()=>{ wc.textContent = countWords(tx.value) + ' kelime'; };
  const sv = ()=>{ ep.tr = ep.tr || {}; ep.tr[transLang] = {title:ti.value, text:tx.value}; upd(); scheduleSave(); };
  ti.oninput = sv; tx.oninput = sv; ti.onblur = saveNow; tx.onblur = saveNow; upd();
  box.querySelector('#trCopy').onclick = ()=>{ if(tx.value.trim() && !confirm('Mevcut çeviri metninin yerine orijinal yazılsın mı?')) return; tx.value = scriptLines(ep.script).join('\n'); sv(); };
  box.querySelectorAll('.trans-chips .nf-opt').forEach(b=>b.onclick = ()=>{ transLang = b.dataset.l; renderTrans(ep); });
}

function openReader(serId, epId){
  const ser = getSeries(serId); if(!ser) return;
  const chs = allChapters(ser); if(!chs.length) return;
  let i = Math.max(0, chs.findIndex(c=>c.e.id === epId));
  const langs = serLangs(ser), orig = serOrig(ser); let lang = orig;
  try{ const sl = localStorage.getItem('luna-rl:' + ser.id); if(sl && langs.includes(sl)) lang = sl; }catch(e){}
  closeOverlays();
  const o = document.createElement('div'); o.className = 'reader';
  o.innerHTML = '<div class="reader-bar"><button class="fmt-btn" id="rdPrev">Önceki</button><span class="reader-title"></span><span class="rd-langs"></span><button class="fmt-btn" id="rdNext">Sonraki</button><button class="fmt-btn" id="rdClose">Kapat</button></div><div class="reader-body" id="rdBody"></div>';
  document.body.appendChild(o);
  const body = o.querySelector('#rdBody'), lb = o.querySelector('.rd-langs');
  const drawLangs = ()=>{ lb.innerHTML = ''; if(langs.length < 2) return; langs.forEach(l=>{ const b = document.createElement('button'); b.type = 'button'; b.textContent = langCode(l); b.title = langName(l); if(l === lang) b.className = 'on'; b.onclick = ()=>{ lang = l; try{ localStorage.setItem('luna-rl:' + ser.id, l); }catch(e){} drawLangs(); show(true); }; lb.appendChild(b); }); };
  const show = (keep)=>{
    const c = chs[i], x = c.e.tr && c.e.tr[lang], tr = lang !== orig && x && String(x.text || '').trim() ? x : null;
    const t = c.label + '. ' + ((tr && tr.title) || c.e.title || 'İsimsiz bölüm');
    o.querySelector('.reader-title').textContent = t;
    const st = body.scrollTop; body.innerHTML = '';
    const h = document.createElement('h1'); h.textContent = t; body.appendChild(h);
    if(lang !== orig && !tr){ const n = document.createElement('p'); n.className = 'muted'; n.textContent = langName(lang) + ' çevirisi henüz yok, orijinal metin gösteriliyor.'; body.appendChild(n); }
    (tr ? String(tr.text).split('\n').map(l=>l.trim()) : scriptLines(c.e.script)).forEach(l=>{ const p = document.createElement('p'); if(l) p.textContent = l; else p.className = 'gap'; body.appendChild(p); });
    const end = document.createElement('div'); end.className = 'reader-end'; end.textContent = T('Bölüm sonu'); body.appendChild(end);
    const cl = creditLines(ser);
    if(cl.length){ const cr = document.createElement('div'); cr.className = 'reader-credits'; cl.forEach(l=>{ const d = document.createElement('div'); d.textContent = l; cr.appendChild(d); }); body.appendChild(cr); }
    body.scrollTop = keep === true ? st : 0;
    o.querySelector('#rdPrev').disabled = i === 0; o.querySelector('#rdNext').disabled = i === chs.length - 1;
  };
  o.querySelector('#rdPrev').onclick = ()=>{ if(i > 0){ i--; show(); } };
  o.querySelector('#rdNext').onclick = ()=>{ if(i < chs.length - 1){ i++; show(); } };
  o.querySelector('#rdClose').onclick = ()=>o.remove();
  drawLangs(); show();
}

    genres:genreList(ser), status:serStatus(ser), synopsis:(ser.synopsis || '').slice(0, 1500), cover:await smallCover(ser.cover), banner:ser.banner || '', logo:ser.logo || '', langs:[serOrig(ser)].concat((ser.langs || []).filter(l=>l !== serOrig(ser) && chs.some(c=>c.tr[l]))),
    wlang:ser.wlang || '', chCount:chs.length, words:chs.reduce((a, c)=>a + countWords(c.text), 0)
  };
  if(!snap.exists) await ref.set(Object.assign(meta, {views:0, reads:0, pop:0, ratingSum:0, ratingCount:0, ratingAvg:0, publishedAt:Date.now(), updatedAt:Date.now()}));
  else { if(ops.length) meta.updatedAt = Date.now(); await ref.set(meta, {merge:true}); }
  await flushOps(ops); // seri belgesi önce: bölüm yazma kuralları buna dayanıyor
  ser.pub = { on:true, id, mode, map:newMap, sig:sigOf(ser, mode), at:Date.now() };
  discList = {};
}
async function pubCleanup(id){
  const ref = fbDb.collection(PUBC).doc(id), uid = currentUser.uid, ops = [];
  const chSnap = await ref.collection('ch').get();
  for(const d of chSnap.docs){
    ops.push(['del', d.ref], ['del', ref.collection('tx').doc(d.id)]);
    try{ (await d.ref.collection('rt').where('so', '==', uid).get()).docs.forEach(x=>ops.push(['del', x.ref])); }catch(e){}
  }
  try{ (await ref.collection('rt').where('so', '==', uid).get()).docs.forEach(x=>ops.push(['del', x.ref])); }catch(e){}
  ops.push(['del', ref]);
  await flushOps(ops);
  discList = {};
}
function pubErr(e){
  const c = (e && e.code) || '', m = (e && e.message) || '';
  if(m === 'empty') return 'Yayınlanacak dolu bir bölüm yok (metni olan ve seçtiğin moda uyan bölüm gerekli).';
  if(m.indexOf('toolong:') === 0) return 'Bu bölüm tek başına çok uzun: ' + m.slice(8);
  if(c.includes('permission-denied')) return 'İzin reddedildi: Firestore güvenlik kurallarını güncellemen gerekiyor (firestore.rules).';
  if(c.includes('unavailable') || c.includes('network')) return 'İnternet bağlantısı yok gibi görünüyor.';
  return 'Bir şeyler ters gitti' + (c ? ' (' + c + ')' : '') + '.';
}

/* ---------- Puanlama ---------- */
async function rateRef(ref, so, v){
  const rref = ref.collection('rt').doc(currentUser.uid);
  return fbDb.runTransaction(async tx=>{
    const p = await tx.get(ref), r = await tx.get(rref);
    if(!p.exists) throw new Error('gone');
    const d = p.data(), old = r.exists ? r.data().v : 0;
    const sum = (d.ratingSum || 0) + v - old, cnt = (d.ratingCount || 0) + (r.exists ? 0 : 1);
    tx.set(rref, {v, at:Date.now(), so});
    tx.update(ref, {ratingSum:sum, ratingCount:cnt, ratingAvg:Math.round(sum / cnt * 100) / 100});
    return {sum, count:cnt};
  });
}
async function ratingWidget(box, ref, cur, so){
  const isOwner = !!(currentUser && currentUser.uid === so);
  let my = 0;
  if(currentUser && !isOwner){ try{ const r = await ref.collection('rt').doc(currentUser.uid).get(); if(r.exists) my = r.data().v; }catch(e){} }
  const draw = ()=>{
    const avg = cur.count ? cur.sum / cur.count : 0;
    box.innerHTML = '<div class="rate-line"><span class="stars">' + [1, 2, 3, 4, 5].map(n=>`<button type="button" data-v="${n}" class="${my ? (n <= my ? 'on' : '') : (n <= Math.round(avg) ? 'avg' : '')}" aria-label="${n}">★</button>`).join('') + '</span><span class="rate-txt">' + (cur.count ? '★ ' + avg.toFixed(1) + ' (' + cur.count + ')' : 'Henüz puan yok') + '</span></div><small class="rate-hint">' + (isOwner ? 'Kendi serini puanlayamazsın' : !currentUser ? 'Puanlamak için giriş yap' : my ? 'Puanın: ' + my + ' — değiştirmek için tekrar tıkla' : 'Yıldıza tıklayarak puanla') + '</small>';
    box.querySelectorAll('.stars button').forEach(b=>b.onclick = async ()=>{
      if(!currentUser){ flashToast('Puanlamak için giriş yapmalısın'); return; }
      if(isOwner){ flashToast('Kendi serini puanlayamazsın'); return; }
      try{ const r = await rateRef(ref, so, +b.dataset.v); cur.sum = r.sum; cur.count = r.count; my = +b.dataset.v; discList = {}; draw(); }
      catch(e){ console.error(e); flashToast('Puan kaydedilemedi'); }
    });
  };
  draw();
}

/* ---------- Herkese açık okuyucu (sadece okuma) ---------- */
function openPubReader(s, chs, idx){
  if(!chs.length) return;
  closeOverlays();
  let i = idx, tok = 0;
  const sref = fbDb.collection(PUBC).doc(s.id), mine = !!(currentUser && currentUser.uid === s.owner);
  const langs = pubLangs(s), orig = s.wlang || 'tr'; let lang = langs[0];
  try{ const sl = localStorage.getItem('luna-rl:' + s.id); if(sl && langs.includes(sl)) lang = sl; }catch(e){}
  const o = document.createElement('div'); o.className = 'reader';
  o.innerHTML = '<div class="reader-bar"><button class="fmt-btn" id="rdPrev">Önceki</button><span class="reader-title"></span><span class="rd-langs"></span><button class="fmt-btn" id="rdNext">Sonraki</button><button class="fmt-btn" id="rdClose">Kapat</button></div><div class="reader-body" id="rdBody"></div>';
  document.body.appendChild(o);
  const body = o.querySelector('#rdBody'), lb = o.querySelector('.rd-langs');
  const drawLangs = ()=>{ lb.innerHTML = ''; if(langs.length < 2) return; langs.forEach(l=>{ const b = document.createElement('button'); b.type = 'button'; b.textContent = langCode(l); b.title = langName(l); if(l === lang) b.className = 'on'; b.onclick = ()=>{ lang = l; try{ localStorage.setItem('luna-rl:' + s.id, l); }catch(e){} drawLangs(); show(); }; lb.appendChild(b); }); };
  const show = async ()=>{
    const c = chs[i], my = ++tok, t0 = c.label + '. ' + (c.title || 'İsimsiz bölüm');
    o.querySelector('.reader-title').textContent = t0;
    o.querySelector('#rdPrev').disabled = i === 0; o.querySelector('#rdNext').disabled = i === chs.length - 1;
    body.innerHTML = ''; body.scrollTop = 0;
    const h = document.createElement('h1'); h.textContent = t0; body.appendChild(h);
    const wait = document.createElement('p'); wait.className = 'muted'; wait.textContent = 'Yükleniyor…'; body.appendChild(wait);
    let text = '', trs = {};
    try{ const d = await sref.collection('tx').doc(c.id).get(); if(d.exists){ text = d.data().text; trs = d.data().tr || {}; } }
    catch(e){ if(my === tok) wait.textContent = pubErr(e); return; }
    if(my !== tok) return;
    wait.remove();
    const tr = lang !== orig && trs[lang] && String(trs[lang].text || '').trim() ? trs[lang] : null;
    if(tr){ const t = c.label + '. ' + (tr.title || c.title || 'İsimsiz bölüm'); h.textContent = t; o.querySelector('.reader-title').textContent = t; text = tr.text; }
    else if(lang !== orig){ const n = document.createElement('p'); n.className = 'muted'; n.textContent = langName(lang) + ' çevirisi henüz yok, orijinal metin gösteriliyor.'; body.appendChild(n); }
    text.split('\n').forEach(l=>{ const p = document.createElement('p'); if(l.trim()) p.textContent = l; else p.className = 'gap'; body.appendChild(p); });
    const end = document.createElement('div'); end.className = 'reader-end'; end.textContent = T('Bölüm sonu'); body.appendChild(end);
    const rb = document.createElement('div'); rb.className = 'reader-rate rate-box'; body.appendChild(rb);
    const cref = sref.collection('ch').doc(c.id);
    ratingWidget(rb, cref, {sum:c.ratingSum || 0, count:c.ratingCount || 0}, s.owner);
    if(i < chs.length - 1){ const nx = document.createElement('div'); nx.className = 'reader-next'; nx.innerHTML = '<button class="fmt-btn primary">Sonraki →</button>'; nx.firstChild.onclick = ()=>{ i++; show(); }; body.appendChild(nx); }
    try{ localStorage.setItem('luna-pr:' + s.id, c.id); }catch(e){}
    if(!mine) countOnce('r:' + c.id, async ()=>{ await cref.update({reads:FVal().increment(1)}); await sref.update({reads:FVal().increment(1), pop:FVal().increment(3)}); });
  };
  o.querySelector('#rdPrev').onclick = ()=>{ if(i > 0){ i--; show(); } };
  o.querySelector('#rdNext').onclick = ()=>{ if(i < chs.length - 1){ i++; show(); } };
  o.querySelector('#rdClose').onclick = ()=>o.remove();
  drawLangs(); show();
}

const _renderHome = renderHome;
renderHome = function(main){
  if(pubSeriesId){ clearInterval(heroTimer); renderPubSeries(main, pubSeriesId); return; }
  if(!homeSeriesId && homeTab === 'discover'){ clearInterval(heroTimer); renderDiscover(main); return; }
  _renderHome(main);
  const h = main.querySelector('.home');
  if(h){ h.insertAdjacentHTML('afterbegin', tabsHtml('library')); bindTabs(h); }
  const ser = homeSeriesId ? getSeries(homeSeriesId) : null, pb = main.querySelector('#spPub');
  if(ser && pb && ser.pub && ser.pub.on) pb.textContent = '🌐 Yayında ✓';
};
const _openSeriesPage = openSeriesPage;
openSeriesPage = function(id){ homeTab = 'library'; pubSeriesId = null; _openSeriesPage(id); };
const _showHome = showHome;
showHome = function(){ pubSeriesId = null; _showHome(); };
const _deleteSeries = deleteSeries;
deleteSeries = function(serId, ev){
  const ser = getSeries(serId), pid = (ser && ser.pub && ser.pub.on && canPub()) ? pubIdOf(ser) : null;
  _deleteSeries(serId, ev);
  if(pid && !getSeries(serId)) pubCleanup(pid).catch(()=>flashToast('Yayındaki kopya silinemedi'));
};
document.getElementById('navDiscover').onclick = ()=>{ homeTab = 'discover'; pubSeriesId = null; showHome(); };
document.getElementById('navLibrary').onclick = ()=>{ homeTab = 'library'; showHome(); };
(function(){ const m = location.hash.match(/^#s=([\w-]+)$/); if(m){ pubSeriesId = m[1]; homeTab = 'discover'; } })();

  fbAuth.onAuthStateChanged(async (user)=>{
    if(user){
      localStorage.removeItem('luna-guest');
      currentUser = user;
      hideAuthScreen();
      await loadData();
      renderAccountRow();
      finishSplash();
    }else if(localStorage.getItem('luna-guest') === '1'){
      currentUser = null;
      await loadData();
      renderAccountRow();
      finishSplash();
    }else{
      finishSplash(showAuthScreen);
    }
  });
}else{
  currentUser = null;
  loadData().then(()=>{ renderAccountRow(); finishSplash(); });
}
