<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA STUDIO</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6' fill='%2314110c'/%3E%3Cpath d='M16 3C10.5 4 7 8.6 7 14c0 6.1 4.9 11 11 11 2 0 3.9-.5 5.5-1.5C20 24.6 16.5 20.7 16.5 16c0-4.7 2.9-8.7 6.5-9.8C21.4 4.3 18.8 3.2 16 3Z' fill='%23c8a15c'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Space+Mono:wght@400;700&family=Caveat:wght@500;600;700&display=swap');
 
  :root{
    --void: #14110c;
    --ink: #1a1610;
    --panel: #221c14;
    --panel-2: #2a2318;
    --line: #3c3324;
    --silver: #efe4cd;
    --silver-dim: #a8987a;
    --accent: #bf4a3d;
    --accent-dim: #5f342d;
    --gold: #c8a15c;
    --danger: #d9645a;
    --ok: #82a86e;
    --editor-font: 'Work Sans', sans-serif;
  }
 
  body[data-theme="sakura"]{
    --void:#1a1113; --ink:#211318; --panel:#2c1a1f; --panel-2:#341f26; --line:#452b31;
    --silver:#f6e7e1; --silver-dim:#b9928e; --accent:#c9636e; --accent-dim:#6b3a3e;
    --gold:#d9a26a; --danger:#e2645c; --ok:#8fae7f;
  }
  body[data-theme="forest"]{
    --void:#0f1410; --ink:#141a15; --panel:#1c241c; --panel-2:#222c22; --line:#33402f;
    --silver:#e8ecdc; --silver-dim:#93a68d; --accent:#749b58; --accent-dim:#41522e;
    --gold:#c2a95a; --danger:#d9767a; --ok:#8fbf7f;
  }
  body[data-theme="parchment"]{
    --void:#ece2c9; --ink:#e3d7b9; --panel:#f4ecd7; --panel-2:#e9dec0; --line:#cab98a;
    --silver:#2c2414; --silver-dim:#6c5f42; --accent:#a03f2e; --accent-dim:#d8bd8e;
    --gold:#886529; --danger:#a03f2e; --ok:#4f7a48;
  }
 
  /* ============ QUIET / NO-MOTION MODE ============ */
  body.no-motion,
  body.no-motion *,
  body.no-motion *::before,
  body.no-motion *::after{
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }
 
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--silver);
    font-family:'Work Sans', sans-serif;
    overflow:hidden;
    transition:background .2s, color .2s;
  }
  ::selection{ background:var(--accent-dim); color:var(--silver); }
 
  .app{ display:flex; height:100vh; }
 
  .sidebar{
    width:290px; min-width:290px;
    background:var(--ink);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    height:100vh;
    position:relative;
  }
  .sidebar::before{
    content:''; position:absolute; top:0; right:-1px; width:1px; height:100%;
    background:linear-gradient(180deg, var(--accent-dim), transparent 60%);
    opacity:.6;
  }
  .brand{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .brand-row{ display:flex; align-items:center; gap:11px; }
  .brand-icon{
    flex-shrink:0; width:36px; height:36px; border-radius:3px;
    background:linear-gradient(150deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.1; }
  .brand-text .b1{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size:21px; letter-spacing:0.01em; color:var(--silver);
  }
  .brand-text .b2{
    font-size:10px; letter-spacing:0.14em; color:var(--silver-dim); margin-top:2px;
  }
  .theme-row{ display:flex; align-items:center; gap:7px; margin-top:15px; }
  .theme-swatch{
    width:19px; height:19px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; padding:0;
  }
  .theme-swatch.active{ border-color:var(--silver); }
  .theme-swatch.t-luna{ background:linear-gradient(135deg,#bf4a3d,#14110c); }
  .theme-swatch.t-sakura{ background:linear-gradient(135deg,#c9636e,#1a1113); }
  .theme-swatch.t-forest{ background:linear-gradient(135deg,#749b58,#0f1410); }
  .theme-swatch.t-parchment{ background:linear-gradient(135deg,#a03f2e,#ece2c9); }
 
  .motion-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
  }
  .motion-label{ font-size:11px; color:var(--silver-dim); }
  .motion-switch{
    position:relative; width:32px; height:18px; border-radius:20px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line); flex-shrink:0;
  }
  .motion-switch .knob{
    position:absolute; top:1px; left:1px; width:14px; height:14px; border-radius:50%;
    background:var(--silver-dim); transition:transform .18s ease, background .18s ease;
  }
  .motion-switch.on{ border-color:var(--accent-dim); }
  .motion-switch.on .knob{ transform:translateX(14px); background:var(--accent); }
 
 
  .tree-wrap{ flex:1; overflow-y:auto; padding:14px 10px 10px; }
  .tree-wrap::-webkit-scrollbar{ width:6px; }
  .tree-wrap::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
 
  .new-series-btn{
    width:100%; margin:0 0 12px 0; display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dim));
    border:none; color:var(--silver); border-radius:3px;
    padding:10px 12px; font-family:'Work Sans',sans-serif; font-size:13px; font-weight:600;
    cursor:pointer; text-align:left; box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .new-series-btn:hover{ filter:brightness(1.1); box-shadow:0 4px 14px rgba(0,0,0,.3); }
  .new-series-btn .plus{ font-size:15px; line-height:1; }
 
  .series-block{ margin-bottom:8px; border-radius:3px; animation:item-in .25s ease; }
  .series-head{
    display:flex; align-items:center; gap:8px;
    padding:8px 8px; border-radius:3px; cursor:pointer; user-select:none;
    background:var(--panel);
  }
  .series-head:hover{ filter:brightness(1.15); }
  .series-chevron{
    width:9px; height:9px; flex-shrink:0;
    border-right:1.5px solid var(--gold); border-bottom:1.5px solid var(--gold);
    transform:rotate(-45deg); transition:transform .15s; margin-left:2px;
  }
  .series-block.open .series-chevron{ transform:rotate(45deg); }
  .series-title{
    flex:1; font-weight:700; color:var(--gold);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-family:'Fraunces', serif; letter-spacing:0.01em; font-size:15.5px;
  }
  .series-count{ font-size:10px; color:var(--silver-dim); }
  .series-del{
    opacity:0; width:18px; height:18px; border:none; background:none;
    color:var(--silver-dim); cursor:pointer; font-size:14px; line-height:1; border-radius:4px;
  }
  .series-head:hover .series-del{ opacity:1; }
  .series-del:hover{ color:var(--danger); }
 
  .series-body{ display:none; padding:8px 0 4px 10px; }
  .series-block.open .series-body{ display:block; }
 
  .new-season-btn{
    width:100%; margin:0 0 6px 0;
    background:none; border:1px dashed var(--line);
    color:var(--silver-dim); border-radius:3px;
    padding:7px 9px; font-family:'Work Sans',sans-serif; font-size:12px;
    cursor:pointer; text-align:left; transition:border-color .15s, color .15s;
  }
  .new-season-btn:hover{ border-color:var(--accent); color:var(--silver); }
 
  .season{ margin-bottom:2px; animation:item-in .25s ease; }
  @keyframes item-in{
    from{ opacity:0; transform:translateX(-4px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .season-head{
    display:flex; align-items:center; gap:8px;
    padding:7px 8px; border-radius:3px; cursor:pointer; user-select:none;
  }
  .season-head:hover{ background:var(--panel); }
  .season-chevron{
    width:8px; height:8px; flex-shrink:0;
    border-right:1.5px solid var(--silver-dim); border-bottom:1.5px solid var(--silver-dim);
    transform:rotate(-45deg); transition:transform .15s; margin-left:2px;
  }
  .season.open .season-chevron{ transform:rotate(45deg); }
  .season-title{
    flex:1; font-size:13px; font-weight:600; color:var(--silver);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .season-count{ font-size:10.5px; color:var(--silver-dim); }
  .season-del{
    opacity:0; width:18px; height:18px; border:none; background:none;
    color:var(--silver-dim); cursor:pointer; font-size:13px; line-height:1; border-radius:4px;
  }
  .season-head:hover .season-del{ opacity:1; }
  .season-del:hover{ color:var(--danger); }
 
  .episodes{ display:none; padding-left:17px; margin-top:2px; }
  .season.open .episodes{ display:block; }
 
  .episode{
    display:flex; align-items:center; gap:7px;
    padding:6px 8px; border-radius:3px; cursor:pointer;
    font-size:12.5px; color:var(--silver-dim);
    border-left:1px solid var(--line); margin-left:2px;
    animation:item-in .25s ease;
  }
  .episode:hover{ background:var(--panel); color:var(--silver); transform:translateX(2px); }
  .episode.active{ background:var(--panel-2); color:var(--gold); border-left-color:var(--accent); }
  .ep-status-dot{
    width:8px; height:8px; border-radius:50%; flex-shrink:0; cursor:pointer;
    border:1.5px solid var(--silver-dim); background:none;
  }
  .ep-status-dot.done{ background:var(--ok); border-color:var(--ok); }
  .episode-name{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .episode-del{
    opacity:0; width:16px; height:16px; border:none; background:none;
    color:var(--silver-dim); cursor:pointer; font-size:12px; line-height:1;
  }
  .episode:hover .episode-del{ opacity:1; }
  .episode-del:hover{ color:var(--danger); }
 
  .new-episode-btn{
    margin:2px 0 6px 19px;
    background:none; border:none; color:var(--accent);
    font-size:11.5px; cursor:pointer; padding:5px 8px;
    opacity:.85;
  }
  .new-episode-btn:hover{ opacity:1; text-decoration:underline; }
 
  .sidebar-footer{
    padding:11px 18px; border-top:1px solid var(--line);
    font-size:10.5px; color:var(--silver-dim); display:flex; justify-content:space-between; align-items:center;
  }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:5px; transition:background .2s; }
  .save-dot.saving{ background:var(--gold); animation:save-pulse .9s ease-in-out infinite; }
  @keyframes save-pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.6); opacity:.55; }
  }
 
  .main{ flex:1; display:flex; flex-direction:column; height:100vh; min-width:0; }
 
  .topbar{
    padding:16px 32px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px;
  }
  .crumb{ font-size:11px; color:var(--silver-dim); white-space:nowrap; }
  .ep-title-input{
    background:none; border:none; outline:none;
    font-family:'Fraunces', serif; font-weight:600;
    font-size:26px; color:var(--silver); flex:1; min-width:0;
  }
  .ep-title-input::placeholder{ color:var(--silver-dim); }
  .ep-meta{ font-size:12px; color:var(--silver-dim); white-space:nowrap; }
 
  .status-toggle{
    display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; flex-shrink:0;
  }
  .status-opt{
    padding:5px 12px; font-size:11px; cursor:pointer; background:none; border:none;
    color:var(--silver-dim); font-family:'Work Sans',sans-serif;
  }
  .status-opt.active.devam{ background:var(--accent-dim); color:var(--silver); }
  .status-opt.active.bitti{ background:var(--ok); color:var(--void); }
 
  .save-pill{
    font-size:11px; color:var(--ok); border:1px solid var(--accent-dim);
    padding:4px 10px; border-radius:3px; white-space:nowrap;
    transition:color .2s, border-color .2s;
  }
  .save-pill.saving{ color:var(--gold); }
 
  .tabs{
    display:flex; gap:2px; padding:0 32px; border-bottom:1px solid var(--line);
    background:var(--ink);
  }
  .tab{
    padding:10px 16px; font-size:12.5px; color:var(--silver-dim);
    cursor:pointer; border-bottom:2px solid transparent; user-select:none;
  }
  .tab:hover{ color:var(--silver); }
  .tab{ position:relative; }
  .tab.active{ color:var(--gold); border-bottom-color:var(--gold); }
  .tab.active::after{
    content:''; position:absolute; left:12px; right:12px; bottom:-2px; height:2px;
    background:var(--gold); animation:tab-underline .25s ease;
  }
  @keyframes tab-underline{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
 
  .panes{ flex:1; overflow:hidden; position:relative; }
  .pane{ display:none; height:100%; }
  .pane.active{ display:flex; flex-direction:column; animation:pane-in .3s ease; }
  @keyframes pane-in{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
 
  .editor-scroll{ flex:1; overflow-y:auto; padding:28px 0; }
  .editor-scroll::-webkit-scrollbar{ width:8px; }
  .editor-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .editor-inner{ max-width:720px; margin:0 auto; padding:0 32px; }
 
  .format-bar{
    display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; align-items:center;
  }
  .fmt-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--silver-dim);
    font-size:11.5px; padding:6px 11px; border-radius:3px; cursor:pointer;
    font-family:'Work Sans',sans-serif;
  }
  .fmt-btn:hover{ color:var(--silver); border-color:var(--accent-dim); }
  .font-select{
    background:var(--panel); border:1px solid var(--line); color:var(--silver);
    font-size:11.5px; padding:6px 9px; border-radius:3px; cursor:pointer;
    font-family:'Work Sans',sans-serif;
  }
  .spell-toggle{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--silver-dim); cursor:pointer; user-select:none;
  }
  .spell-toggle input{ accent-color:var(--accent); }
 
  #editor{
    width:100%; min-height:60vh; background:none; border:none; outline:none;
    resize:none; color:var(--silver); font-size:16.5px; line-height:1.85;
    font-family:var(--editor-font); white-space:pre-wrap;
  }
  #editor::placeholder{ color:var(--silver-dim); }
 
  .editor-footer{
    border-top:1px solid var(--line); padding:14px 32px;
    display:flex; justify-content:space-between; font-size:11.5px; color:var(--silver-dim);
  }
 
  .notes-pane{ padding:28px 32px; overflow-y:auto; }
  .notes-grid{ max-width:820px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .note-card{ background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:18px; }
  .note-card h3{
    margin:0 0 10px; font-family:'Fraunces', serif; font-weight:600;
    font-size:17px; color:var(--gold); font-style:italic;
  }
  .note-card textarea{
    width:100%; min-height:130px; background:none; border:none; outline:none;
    resize:vertical; color:var(--silver-dim); font-size:13.5px; line-height:1.7;
    font-family:var(--editor-font);
  }
  .note-card textarea:focus{ color:var(--silver); }
 
  .chars-pane, .images-pane{ padding:28px 32px; overflow-y:auto; }
  .chars-inner, .images-inner{ max-width:820px; margin:0 auto; }
  .char-add, .img-add-label{
    display:inline-block;
    background:none; border:1px dashed var(--line); color:var(--silver-dim);
    padding:10px 16px; border-radius:3px; cursor:pointer; font-size:13px; margin-bottom:16px;
  }
  .char-add:hover, .img-add-label:hover{ border-color:var(--accent); color:var(--silver); }
  .char-card{
    background:var(--panel); border:1px solid var(--line); border-radius:3px;
    padding:16px 18px; margin-bottom:12px; display:flex; gap:14px; align-items:flex-start;
  }
  .char-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0; margin-top:2px;
    background:linear-gradient(135deg, var(--accent), var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:16px; color:var(--void);
    overflow:hidden; background-size:cover; background-position:center;
  }
  .char-body{ flex:1; min-width:0; }
  .char-name{
    background:none; border:none; outline:none; width:100%;
    font-size:15px; font-weight:700; color:var(--silver); margin-bottom:6px;
    font-family:'Work Sans',sans-serif;
  }
  .char-name::placeholder{ font-weight:600; color:var(--silver-dim); }
  .char-desc{
    background:none; border:none; outline:none; width:100%; resize:none;
    color:var(--silver-dim); font-size:13px; line-height:1.6; min-height:20px;
    font-family:'Work Sans',sans-serif;
  }
  .char-desc:focus{ color:var(--silver); }
  .char-photo-btn{
    font-size:10.5px; color:var(--accent); cursor:pointer; margin-top:6px; display:inline-block;
  }
  .char-del{
    background:none; border:none; color:var(--silver-dim); cursor:pointer;
    font-size:16px; margin-top:2px;
  }
  .char-del:hover{ color:var(--danger); }
 
  .img-hint{ font-size:11.5px; color:var(--silver-dim); margin-bottom:14px; }
  .img-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:16px; }
  .img-card{ background:var(--panel); border:1px solid var(--line); border-radius:3px; overflow:hidden; }
  .img-card img{ width:100%; height:140px; object-fit:cover; display:block; }
  .img-card-body{ padding:10px 12px; }
  .img-caption{
    width:100%; background:none; border:none; outline:none; color:var(--silver-dim);
    font-size:12px; font-family:'Work Sans',sans-serif;
  }
  .img-caption:focus{ color:var(--silver); }
  .img-del{
    background:none; border:none; color:var(--silver-dim); cursor:pointer; font-size:12px;
    float:right;
  }
  .img-del:hover{ color:var(--danger); }
 
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--silver-dim); text-align:center; padding:40px;
  }
  .empty-state .moon-icon{ margin-bottom:18px; opacity:.5; }
  .empty-state h2{
    font-family:'Fraunces', serif; font-weight:500; font-style:italic;
    color:var(--silver); font-size:22px; margin:0 0 8px;
  }
  .empty-state p{ font-size:13.5px; max-width:340px; line-height:1.6; margin:0; }
 
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--accent-dim); color:var(--silver);
    padding:10px 18px; border-radius:3px; font-size:12.5px; opacity:0;
    transition:opacity .25s, transform .25s; pointer-events:none; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
 
  /* ============ AMBIENT BACKGROUND ============ */
  .bg-ambience{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .bg-orb{ display:none; }
  .bg-stars{
    position:absolute; inset:0;
    opacity:.35; mix-blend-mode:overlay;
  }
  .bg-star{
    position:absolute; width:1.5px; height:1.5px; border-radius:50%;
    background:var(--gold); opacity:0; animation:fleck 6s ease-in-out infinite;
  }
  @keyframes fleck{
    0%,100%{ opacity:0; transform:scale(.7); }
    50%{ opacity:.5; transform:scale(1.2); }
  }
  body[data-theme="parchment"] .bg-stars{ opacity:.5; }
  body[data-theme="parchment"] .bg-star{ background:var(--accent); }
 
  .app{ position:relative; z-index:1; }
 
  /* ============ VERSION BADGE ============ */
  .version-badge{
    position:fixed; bottom:14px; right:16px; z-index:40;
    font-size:10.5px; letter-spacing:.04em; color:var(--silver-dim);
    background:var(--panel); border:1px solid var(--line); border-radius:3px;
    padding:5px 12px; display:flex; align-items:center; gap:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .version-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); }
 
  /* ============ SPLASH / INTRO ============ */
  .splash{
    position:fixed; inset:0; z-index:100;
    background:var(--void);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .6s ease, visibility .6s ease;
  }
  .splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .splash-moon{
    width:64px; height:64px; margin-bottom:22px;
    animation:splash-pulse 2.2s ease-in-out infinite;
  }
  @keyframes splash-pulse{
    0%,100%{ filter:drop-shadow(0 0 5px rgba(200,161,92,.3)); transform:scale(1); }
    50%{ filter:drop-shadow(0 0 16px rgba(200,161,92,.6)); transform:scale(1.04); }
  }
  .splash-title{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size:34px; color:var(--silver); letter-spacing:.02em;
    opacity:0; animation:splash-fade-up .9s ease .3s forwards;
  }
  .splash-sub{
    font-size:11px; letter-spacing:.24em; color:var(--silver-dim); margin-top:10px;
    opacity:0; animation:splash-fade-up .9s ease .55s forwards;
  }
  @keyframes splash-fade-up{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .splash-bar{
    width:180px; height:2px; background:var(--line); border-radius:2px; margin-top:28px; overflow:hidden;
    opacity:0; animation:splash-fade-up .9s ease .7s forwards;
  }
  .splash-bar-fill{
    height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--gold));
    animation:splash-load 1.3s ease .8s forwards;
  }
  @keyframes splash-load{ to{ width:100%; } }
 
  /* ============ REFINED BUTTONS ============ */
  .new-series-btn, .new-season-btn, .new-episode-btn, .fmt-btn, .char-add, .img-add-label,
  .exportBtn, #exportBtn{
    transition:transform .12s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .new-series-btn:active, .fmt-btn:active, .char-add:active, .img-add-label:active{
    transform:scale(.97);
  }
  .new-series-btn{
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .new-series-btn:hover{
    background:var(--panel-2);
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  #exportBtn{
    background:linear-gradient(135deg, var(--accent), var(--accent-dim));
    color:var(--silver); border:none; font-weight:600;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  #exportBtn:hover{ filter:brightness(1.12); box-shadow:0 5px 16px rgba(0,0,0,.35); }
  #exportBtn:active{ transform:scale(.96); }
  .status-toggle{ box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .status-opt{ transition:background .15s ease, color .15s ease; cursor:pointer; }
  .save-pill{ box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .theme-swatch{ transition:transform .15s ease, border-color .15s ease; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .theme-swatch:hover{ transform:scale(1.15); }
  .episode{ transition:background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
  .fmt-btn:hover, .char-add:hover, .img-add-label:hover{ transform:translateY(-1px); }
  .episode.active{ box-shadow:inset 0 0 0 1px var(--accent-dim); }
  .series-head, .season-head{ transition:background .15s ease; }
  .tab{ transition:color .15s ease, border-color .15s ease; }
  .char-card, .img-card, .note-card{ transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
  .char-card:hover, .img-card:hover, .note-card:hover{
    border-color:var(--accent-dim); box-shadow:0 4px 16px rgba(0,0,0,.2); transform:translateY(-2px);
  }
  .ep-status-dot{ transition:transform .15s ease, background .15s ease; }
  .ep-status-dot:hover{ transform:scale(1.25); }
 
  /* ============ PHONE MODE / RESPONSIVE ============ */
  .menu-toggle{
    display:none; position:relative; z-index:20; flex-direction:column; justify-content:center;
    align-items:center; gap:4px; width:36px; height:36px; margin:10px 0 0 10px; flex-shrink:0;
    background:var(--panel); border:1px solid var(--line); border-radius:3px; cursor:pointer;
  }
  .menu-toggle span{ width:16px; height:1.5px; background:var(--silver); display:block; }
  .sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:59;
  }
  .sidebar-backdrop.show{ display:block; }
 
  @media (max-width: 820px){
    .menu-toggle{ display:flex; }
    .app{ position:relative; }
    .sidebar{
      position:fixed; top:0; left:0; z-index:60; width:82vw; max-width:320px; min-width:0;
      transform:translateX(-100%); transition:transform .25s ease;
      box-shadow:12px 0 32px rgba(0,0,0,.4);
    }
    .sidebar.open{ transform:translateX(0); }
    .main{ width:100%; }
    .version-badge{ display:none; }
    .topbar{ padding:10px 14px; gap:10px; flex-wrap:wrap; }
    .ep-title-input{ font-size:20px; }
    .ep-meta{ display:none; }
    .status-toggle{ order:3; }
    .tabs{ padding:0 14px; overflow-x:auto; }
    .tabs::-webkit-scrollbar{ display:none; }
    .editor-inner{ padding:0 16px; max-width:100%; }
    .notes-pane, .chars-pane, .images-pane{ padding:20px 16px; }
    .notes-grid{ grid-template-columns:1fr; }
    .img-grid{ grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); }
    .editor-footer{ padding:12px 16px; }
    .char-card{ flex-wrap:wrap; }
  }
</style>
</head>

<input type="file" id="hiddenCharImgInput" accept="image/*" style="display:none">
 
<script>
/* ================= STATE ================= */
let data = { series: [] };
let currentSeriesId = null;
let currentSeasonId = null;
let currentEpisodeId = null;
let currentTab = 'script';
let saveTimer = null;
let spellcheckOn = true;
let currentFont = 'sans';
let noMotion = false;
let currentTheme = 'luna';
let pendingCharPhotoId = null;
 
const STORAGE_KEY = 'luna-studio:project';
const FONT_MAP = {
  sans: "'Work Sans', sans-serif",
  serif: "'Source Serif 4', serif",
  display: "'Fraunces', serif",
  script: "'Courier Prime', monospace",
  classic: "'Playfair Display', serif",
  mono: "'Space Mono', monospace",
  hand: "'Caveat', cursive"
};
const THEMES = [
  {id:'luna', cls:'t-luna', label:'Luna (gece)'},
  {id:'sakura', cls:'t-sakura', label:'Sakura'},
  {id:'forest', cls:'t-forest', label:'Orman'},
  {id:'parchment', cls:'t-parchment', label:'Parşömen (gündüz)'}
];
 
function uid(){ return 'id' + Math.random().toString(36).slice(2,10); }
 
/* ================= STORAGE (with safe fallback) ================= */
let storageMode = 'unknown'; // 'cloud' | 'local'
 
async function detectStorage(){
  if(window.storage && typeof window.storage.set === 'function'){
    try{
      await window.storage.set('luna-studio:ping', '1');
      storageMode = 'cloud';
      return;
    }catch(e){
      storageMode = 'local';
      return;
    }
  }
  storageMode = 'local';
}
 
async function storageGetProject(){
  if(storageMode === 'cloud'){
    try{
      const r = await window.storage.get(STORAGE_KEY);
      return r && r.value ? r.value : null;
    }catch(e){
      storageMode = 'local'; // fall through to local
    }
  }
  try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; }
}
 
async function storageSetProject(json){
  if(storageMode === 'cloud'){
    try{
      await window.storage.set(STORAGE_KEY, json);
      return true;
    }catch(e){
      storageMode = 'local'; // fall through and try local instead of erroring forever
    }
  }
  try{ localStorage.setItem(STORAGE_KEY, json); return true; }
  catch(e){ return false; }
}
 
async function loadData(){
  await detectStorage();
  try{
    const raw = await storageGetProject();
    if(raw) data = JSON.parse(raw);
  }catch(e){ /* start fresh */ }
  if(!data.series) data.series = [];
  if(data.seasons && data.seasons.length && data.series.length===0){
    data.series.push({ id: uid(), title: 'Seri 1', open:true, seasons: data.seasons });
    delete data.seasons;
  }
  // migrate episodes missing new fields
  data.series.forEach(ser=>ser.seasons.forEach(s=>s.episodes.forEach(e=>{
    if(!e.status) e.status = 'devam';
    if(!e.images) e.images = [];
    if(!e.characters) e.characters = [];
  })));
 
  const sc = localStorage.getItem('luna-spellcheck');
  if(sc !== null) spellcheckOn = sc === '1';
  const f = localStorage.getItem('luna-font');
  if(f && FONT_MAP[f]) currentFont = f;
  const th = localStorage.getItem('luna-theme');
  if(th && THEMES.some(t=>t.id===th)) currentTheme = th;
  const nm = localStorage.getItem('luna-motion');
  if(nm !== null) noMotion = nm === '1';
 
  applyTheme();
  applyFont();
  applyMotion();
  render();
}
 
async function saveData(){
  setSaveState(true);
  const ok = await storageSetProject(JSON.stringify(data));
  setSaveState(false);
  if(!ok) flashToast('Kayıt bu cihazda tutulamadı');
}
 
function setSaveState(saving){
  const dot = document.getElementById('saveDot');
  const pill = document.getElementById('savePill');
  if(dot) dot.classList.toggle('saving', saving);
  if(pill){
    pill.textContent = saving ? '● kaydediliyor…' : '● kaydedildi';
    pill.classList.toggle('saving', saving);
  }
}
 
function scheduleSave(){
  clearTimeout(saveTimer);
  setSaveState(true);
  saveTimer = setTimeout(()=>saveData(), 600);
}
function saveNow(){
  clearTimeout(saveTimer);
  saveData();
}
function flashToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}
 
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', saveNow);
window.addEventListener('blur', saveNow);
 
/* ================= THEME / FONT ================= */
function applyTheme(){
  document.body.setAttribute('data-theme', currentTheme);
  renderThemeRow();
}
function setTheme(id){
  currentTheme = id;
  localStorage.setItem('luna-theme', id);
  applyTheme();
}
function renderThemeRow(){
  const row = document.getElementById('themeRow');
  row.innerHTML = '';
  THEMES.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'theme-swatch ' + t.cls + (currentTheme===t.id ? ' active':'');
    b.title = t.label;
    b.onclick = ()=>setTheme(t.id);
    row.appendChild(b);
  });
}
function applyFont(){
  document.documentElement.style.setProperty('--editor-font', FONT_MAP[currentFont] || FONT_MAP.sans);
}
function setFont(id){
  currentFont = id;
  localStorage.setItem('luna-font', id);
  applyFont();
}
 
/* ================= MOTION (QUIET MODE) ================= */
function applyMotion(){
  document.body.classList.toggle('no-motion', !!noMotion);
  const sw = document.getElementById('motionSwitch');
  if(sw) sw.classList.toggle('on', !!noMotion);
}
function setMotion(off){
  noMotion = off;
  localStorage.setItem('luna-motion', off ? '1':'0');
  applyMotion();
}
document.getElementById('motionSwitch').onclick = ()=>setMotion(!noMotion);
 
/* ================= PHONE MODE (SIDEBAR DRAWER) ================= */
function openSidebar(){
  document.querySelector('.sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('show');
}
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}
document.getElementById('menuToggle').onclick = ()=>{
  const sb = document.querySelector('.sidebar');
  sb.classList.contains('open') ? closeSidebar() : openSidebar();
};
document.getElementById('sidebarBackdrop').onclick = closeSidebar;
 
/* ================= DATA HELPERS ================= */
function getSeries(id){ return data.series.find(s=>s.id===id); }
function getSeason(serId,sId){
  const ser = getSeries(serId);
  return ser ? ser.seasons.find(s=>s.id===sId) : null;
}
function getEpisode(serId,sId,eId){
  const s = getSeason(serId,sId);
  return s ? s.episodes.find(e=>e.id===eId) : null;
}
 
function addSeries(){
  data.series.push({ id: uid(), title: 'Yeni Seri', open:true, seasons: [] });
  renderTree(); saveNow();
}
function addSeason(serId){
  const ser = getSeries(serId);
  if(!ser) return;
  ser.seasons.push({ id: uid(), title: 'Yeni Sezon', open:true, episodes: [] });
  renderTree(); saveNow();
}
function addEpisode(serId,sId){
  const s = getSeason(serId,sId);
  if(!s) return;
  const e = { id: uid(), title:'', script:'', status:'devam',
    notes:{synopsis:'', worldbuilding:'', outline:'', misc:''}, characters:[], images:[] };
  s.episodes.push(e);
  currentSeriesId = serId; currentSeasonId = sId; currentEpisodeId = e.id;
  s.open = true;
  renderTree(); renderMain(); saveNow();
}
function deleteSeries(serId, ev){
  ev.stopPropagation();
  if(!confirm('Bu seri, içindeki tüm sezon ve bölümlerle birlikte silinsin mi?')) return;
  data.series = data.series.filter(s=>s.id!==serId);
  if(currentSeriesId===serId){ currentSeriesId=null; currentSeasonId=null; currentEpisodeId=null; }
  renderTree(); renderMain(); saveNow();
}
function deleteSeason(serId, sId, ev){
  ev.stopPropagation();
  if(!confirm('Bu sezon ve içindeki tüm bölümler silinsin mi?')) return;
  const ser = getSeries(serId);
  ser.seasons = ser.seasons.filter(s=>s.id!==sId);
  if(currentSeasonId===sId){ currentSeasonId=null; currentEpisodeId=null; }
  renderTree(); renderMain(); saveNow();
}
function deleteEpisode(serId, sId, eId, ev){
  ev.stopPropagation();
  if(!confirm('Bu bölüm silinsin mi?')) return;
  const s = getSeason(serId,sId);
  s.episodes = s.episodes.filter(e=>e.id!==eId);
  if(currentEpisodeId===eId) currentEpisodeId=null;
  renderTree(); renderMain(); saveNow();
}
function selectEpisode(serId, sId, eId){
  saveNow();
  currentSeriesId = serId; currentSeasonId = sId; currentEpisodeId = eId;
  currentTab = 'script';
  renderTree(); renderMain();
  if(window.innerWidth <= 820) closeSidebar();
}
function toggleSeries(serId){ const ser=getSeries(serId); ser.open=!ser.open; renderTree(); }
function toggleSeason(serId, sId){ const s=getSeason(serId,sId); s.open=!s.open; renderTree(); }
 
function toggleEpisodeStatus(serId, sId, eId, ev){
  if(ev) ev.stopPropagation();
  const e = getEpisode(serId, sId, eId);
  e.status = e.status === 'bitti' ? 'devam' : 'bitti';
  renderTree();
  if(currentEpisodeId===eId) renderMain();
  saveNow();
}
 
/* ================= RENDER: TREE ================= */
function renderTree(){
  const wrap = document.getElementById('seriesList');
  wrap.innerHTML = '';
  let totalEpisodes = 0, totalSeasons = 0, totalDone = 0;
 
  data.series.forEach(ser=>{
    const serBlock = document.createElement('div');
    serBlock.className = 'series-block' + (ser.open ? ' open':'');
 
    const sHead = document.createElement('div');
    sHead.className = 'series-head';
    sHead.onclick = ()=>toggleSeries(ser.id);
    sHead.innerHTML = `
      <span class="series-chevron"></span>
      <span class="series-title" contenteditable="true" spellcheck="false"></span>
      <span class="series-count">${ser.seasons.length}</span>
      <button class="series-del" title="Seriyi sil">✕</button>
    `;
    const serTitleSpan = sHead.querySelector('.series-title');
    serTitleSpan.textContent = ser.title;
    serTitleSpan.onclick = (e)=>e.stopPropagation();
    serTitleSpan.onblur = ()=>{ ser.title = serTitleSpan.textContent.trim() || 'İsimsiz Seri'; renderMain(); saveNow(); };
    serTitleSpan.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); serTitleSpan.blur(); } };
    sHead.querySelector('.series-del').onclick = (ev)=>deleteSeries(ser.id, ev);
    serBlock.appendChild(sHead);
 
    const serBody = document.createElement('div');
    serBody.className = 'series-body';
 
    const addSeasonBtn = document.createElement('button');
    addSeasonBtn.className = 'new-season-btn';
    addSeasonBtn.textContent = '+ Yeni sezon';
    addSeasonBtn.onclick = ()=>addSeason(ser.id);
    serBody.appendChild(addSeasonBtn);
 
    ser.seasons.forEach(s=>{
      totalSeasons++;
      totalEpisodes += s.episodes.length;
      const seasonEl = document.createElement('div');
      seasonEl.className = 'season' + (s.open ? ' open':'');
 
      const doneCount = s.episodes.filter(e=>e.status==='bitti').length;
      totalDone += doneCount;
 
      const head = document.createElement('div');
      head.className = 'season-head';
      head.onclick = ()=>toggleSeason(ser.id, s.id);
      head.innerHTML = `
        <span class="season-chevron"></span>
        <span class="season-title" contenteditable="true" spellcheck="false"></span>
        <span class="season-count">${doneCount}/${s.episodes.length}</span>
        <button class="season-del" title="Sezonu sil">✕</button>
      `;
      const titleSpan = head.querySelector('.season-title');
      titleSpan.textContent = s.title;
      titleSpan.onclick = (e)=>e.stopPropagation();
      titleSpan.onblur = ()=>{ s.title = titleSpan.textContent.trim() || 'İsimsiz Sezon'; renderMain(); saveNow(); };
      titleSpan.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); titleSpan.blur(); } };
      head.querySelector('.season-del').onclick = (ev)=>deleteSeason(ser.id, s.id, ev);
      seasonEl.appendChild(head);
 
      const epList = document.createElement('div');
      epList.className = 'episodes';
      s.episodes.forEach((e,idx)=>{
        const epEl = document.createElement('div');
        epEl.className = 'episode' + (currentEpisodeId===e.id ? ' active':'');
        epEl.onclick = ()=>selectEpisode(ser.id, s.id, e.id);
        epEl.innerHTML = `
          <button class="ep-status-dot ${e.status==='bitti'?'done':''}" title="${e.status==='bitti'?'Bitti':'Devam ediyor'}"></button>
          <span class="episode-name">${(idx+1)+'. '+(e.title || 'İsimsiz bölüm')}</span>
          <button class="episode-del" title="Sil">✕</button>
        `;
        epEl.querySelector('.ep-status-dot').onclick = (ev)=>toggleEpisodeStatus(ser.id,s.id,e.id,ev);
        epEl.querySelector('.episode-del').onclick = (ev)=>deleteEpisode(ser.id,s.id,e.id,ev);
        epList.appendChild(epEl);
      });
      seasonEl.appendChild(epList);
 
      const addEpBtn = document.createElement('button');
      addEpBtn.className = 'new-episode-btn';
      addEpBtn.textContent = '+ Yeni bölüm';
      addEpBtn.style.display = s.open ? 'block' : 'none';
      addEpBtn.onclick = ()=>addEpisode(ser.id, s.id);
      seasonEl.appendChild(addEpBtn);
 
      serBody.appendChild(seasonEl);
    });
 
    serBlock.appendChild(serBody);
    wrap.appendChild(serBlock);
  });
 
  document.getElementById('totalStats').innerHTML =
    `<span class="save-dot" id="saveDot"></span>${data.series.length} seri · ${totalSeasons} sezon · ${totalDone}/${totalEpisodes} bölüm bitti`;
}
 
/* ================= RENDER: MAIN ================= */
function renderMain(){
  const main = document.getElementById('mainContent');
  const ep = currentEpisodeId ? getEpisode(currentSeriesId, currentSeasonId, currentEpisodeId) : null;
 
  if(!ep){
    main.innerHTML = `
      <div class="empty-state" style="height:100vh;">
        <svg class="moon-icon" width="52" height="52" viewBox="0 0 26 26" fill="none">
          <path d="M16 3C10.5 4 7 8.6 7 14c0 6.1 4.9 11 11 11 2 0 3.9-.5 5.5-1.5C20 24.6 16.5 20.7 16.5 16c0-4.7 2.9-8.7 6.5-9.8C21.4 4.3 18.8 3.2 16 3Z" fill="var(--silver-dim)"/>
        </svg>
        <h2>Boş bir sayfa, sonsuz bir gece</h2>
        <p>Soldan bir seri aç, içine bir sezon ve bölüm ekle. Seri, sezon, bölüm, not, karakter ve görseller — hepsi girdiğin anda otomatik kaydedilir.</p>
      </div>`;
    return;
  }
 
  const ser = getSeries(currentSeriesId);
  const season = getSeason(currentSeriesId, currentSeasonId);
  const wc = countWords(ep.script);
 
  main.innerHTML = `
    <div class="topbar">
      <div style="display:flex; flex-direction:column; gap:2px; flex:1; min-width:0;">
        <span class="crumb">${escapeHtml(ser.title)} / ${escapeHtml(season.title)}</span>
        <input class="ep-title-input" id="titleInput" placeholder="Bölüm başlığı..." value="${escapeAttr(ep.title)}">
      </div>
      <span class="ep-meta">${wc} kelime</span>
      <div class="status-toggle">
        <button class="status-opt devam ${ep.status!=='bitti'?'active devam':''}" id="btnDevam">Devam ediyor</button>
        <button class="status-opt bitti ${ep.status==='bitti'?'active bitti':''}" id="btnBitti">Bitti</button>
      </div>
      <span class="save-pill" id="savePill">● kaydedildi</span>
    </div>
    <div class="tabs">
      <div class="tab ${currentTab==='script'?'active':''}" data-tab="script">Senaryo</div>
      <div class="tab ${currentTab==='notes'?'active':''}" data-tab="notes">Notlar</div>
      <div class="tab ${currentTab==='chars'?'active':''}" data-tab="chars">Karakterler</div>
      <div class="tab ${currentTab==='images'?'active':''}" data-tab="images">Görseller</div>
    </div>
    <div class="panes">
      <div class="pane ${currentTab==='script'?'active':''}" id="pane-script">
        <div class="editor-scroll">
          <div class="editor-inner">
            <div class="format-bar">
              <button class="fmt-btn" data-ins="\\n\\nSAHNE ${'\u2014'} ">+ Sahne</button>
              <button class="fmt-btn" data-ins="\\n\\nKARAKTER ADI:\\n">+ Diyalog</button>
              <button class="fmt-btn" data-ins="\\n(parantez içi yönlendirme)\\n">+ Yönlendirme</button>
              <button class="fmt-btn" id="exportBtn">↓ Dışa aktar (.txt)</button>
              <select class="font-select" id="fontSelect">
                <option value="sans">Yazı: Sade (Work Sans)</option>
                <option value="serif">Yazı: Kitap (Source Serif)</option>
                <option value="display">Yazı: Zarif (Fraunces)</option>
                <option value="classic">Yazı: Klasik (Playfair)</option>
                <option value="script">Yazı: Senaryo (Courier)</option>
                <option value="mono">Yazı: Daktilo (Space Mono)</option>
                <option value="hand">Yazı: El yazısı (Caveat)</option>
              </select>
              <label class="spell-toggle">
                <input type="checkbox" id="spellToggle" ${spellcheckOn ? 'checked':''}>
                Yazım denetimi
              </label>
            </div>
            <textarea id="editor" placeholder="Bir zamanlar..." spellcheck="${spellcheckOn}" lang="tr"></textarea>
          </div>
        </div>
        <div class="editor-footer">
          <span id="wordCountFooter">${wc} kelime · ${ep.script.length} karakter</span>
          <span>Kırmızı çizgili kelimeye sağ tıkla, önerilen düzeltmeyi seç.</span>
        </div>
      </div>
 
      <div class="pane ${currentTab==='notes'?'active':''}" id="pane-notes">
        <div class="notes-pane">
          <div class="notes-grid">
            <div class="note-card">
              <h3>Konu özeti</h3>
              <textarea id="note-synopsis" spellcheck="${spellcheckOn}" lang="tr" placeholder="Bu bölümde ne oluyor?">${escapeHtml(ep.notes.synopsis)}</textarea>
            </div>
            <div class="note-card">
              <h3>Dünya kurgusu</h3>
              <textarea id="note-worldbuilding" spellcheck="${spellcheckOn}" lang="tr" placeholder="Mekanlar, kurallar, arka plan...">${escapeHtml(ep.notes.worldbuilding)}</textarea>
            </div>
            <div class="note-card">
              <h3>Sahne akışı</h3>
              <textarea id="note-outline" spellcheck="${spellcheckOn}" lang="tr" placeholder="1. Sahne...&#10;2. Sahne...">${escapeHtml(ep.notes.outline)}</textarea>
            </div>
            <div class="note-card">
              <h3>Diğer</h3>
              <textarea id="note-misc" spellcheck="${spellcheckOn}" lang="tr" placeholder="Aklına takılan her şey...">${escapeHtml(ep.notes.misc)}</textarea>
            </div>
          </div>
        </div>
      </div>
 
      <div class="pane ${currentTab==='chars'?'active':''}" id="pane-chars">
        <div class="chars-pane">
          <div class="chars-inner">
            <button class="char-add" id="addCharBtn">+ Karakter ekle</button>
            <div id="charList"></div>
          </div>
        </div>
      </div>
 
      <div class="pane ${currentTab==='images'?'active':''}" id="pane-images">
        <div class="images-pane">
          <div class="images-inner">
            <label class="img-add-label" for="hiddenImgInput">+ Görsel yükle</label>
            <div class="img-hint">Referans görselleri, mekan/karakter çizimleri veya kapak görseli ekle. Görüntüler bu bölüme kaydedilir.</div>
            <div class="img-grid" id="imgGrid"></div>
          </div>
        </div>
      </div>
    </div>
  `;
 
  const titleInput = document.getElementById('titleInput');
  titleInput.oninput = ()=>{ ep.title = titleInput.value; renderTree(); scheduleSave(); };
  titleInput.onblur = saveNow;
 
  document.getElementById('btnDevam').onclick = ()=>{ ep.status='devam'; renderMain(); renderTree(); saveNow(); };
  document.getElementById('btnBitti').onclick = ()=>{ ep.status='bitti'; renderMain(); renderTree(); saveNow(); };
 
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ saveNow(); currentTab = t.dataset.tab; renderMain(); };
  });
 
  const editor = document.getElementById('editor');
  editor.value = ep.script;
  editor.oninput = ()=>{
    ep.script = editor.value;
    const words = countWords(ep.script);
    document.getElementById('wordCountFooter').textContent = `${words} kelime · ${ep.script.length} karakter`;
    scheduleSave();
  };
  editor.onblur = saveNow;
 
  const fontSelect = document.getElementById('fontSelect');
  fontSelect.value = currentFont;
  fontSelect.onchange = (e)=>setFont(e.target.value);
 
  document.getElementById('spellToggle').onchange = (e)=>{
    spellcheckOn = e.target.checked;
    localStorage.setItem('luna-spellcheck', spellcheckOn ? '1':'0');
    renderMain();
  };
 
  document.querySelectorAll('.fmt-btn[data-ins]').forEach(b=>{
    b.onclick = ()=>{
      const insert = b.dataset.ins.replace(/\\n/g,'\n');
      const pos = editor.selectionStart;
      editor.value = editor.value.slice(0,pos) + insert + editor.value.slice(pos);
      editor.focus();
      editor.selectionStart = editor.selectionEnd = pos + insert.length;
      ep.script = editor.value;
      scheduleSave();
    };
  });
 
  document.getElementById('exportBtn').onclick = ()=>exportEpisode(ep);
 
  ['synopsis','worldbuilding','outline','misc'].forEach(key=>{
    const ta = document.getElementById('note-'+key);
    ta.oninput = ()=>{ ep.notes[key] = ta.value; scheduleSave(); };
    ta.onblur = saveNow;
  });
 
  document.getElementById('addCharBtn').onclick = ()=>{
    ep.characters.push({id:uid(), name:'', desc:'', photo:''});
    renderMain();
    saveNow();
  };
 
  renderChars(ep);
  renderImages(ep);
}
 
function renderChars(ep){
  const list = document.getElementById('charList');
  if(!list) return;
  list.innerHTML = '';
  ep.characters.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'char-card';
    const initial = (c.name||'?').trim().charAt(0).toUpperCase() || '?';
    card.innerHTML = `
      <div class="char-avatar" style="${c.photo ? `background-image:url('${c.photo}')`:''}">${c.photo ? '' : initial}</div>
      <div class="char-body">
        <input class="char-name" spellcheck="${spellcheckOn}" lang="tr" placeholder="Karakter adı" value="${escapeAttr(c.name)}">
        <textarea class="char-desc" rows="2" spellcheck="${spellcheckOn}" lang="tr" placeholder="Kısa tanım, motivasyon, ses tonu...">${escapeHtml(c.desc)}</textarea>
        <span class="char-photo-btn">${c.photo ? 'Fotoğrafı değiştir' : '+ Fotoğraf ekle'}</span>
      </div>
      <button class="char-del">✕</button>
    `;
    const nameInput = card.querySelector('.char-name');
    nameInput.oninput = ()=>{
      c.name = nameInput.value;
      if(!c.photo) card.querySelector('.char-avatar').textContent = (c.name||'?').trim().charAt(0).toUpperCase() || '?';
      scheduleSave();
    };
    nameInput.onblur = saveNow;
    const descInput = card.querySelector('.char-desc');
    descInput.oninput = ()=>{ c.desc = descInput.value; scheduleSave(); };
    descInput.onblur = saveNow;
    card.querySelector('.char-photo-btn').onclick = ()=>{
      pendingCharPhotoId = c.id;
      document.getElementById('hiddenCharImgInput').click();
    };
    card.querySelector('.char-del').onclick = ()=>{
      ep.characters = ep.characters.filter(x=>x.id!==c.id);
      renderChars(ep);
      saveNow();
    };
    list.appendChild(card);
  });
}
 
function renderImages(ep){
  const grid = document.getElementById('imgGrid');
  if(!grid) return;
  grid.innerHTML = '';
  ep.images.forEach(img=>{
    const card = document.createElement('div');
    card.className = 'img-card';
    card.innerHTML = `
      <img src="${img.dataUrl}" alt="">
      <div class="img-card-body">
        <button class="img-del">✕</button>
        <input class="img-caption" placeholder="Açıklama ekle..." value="${escapeAttr(img.caption)}">
      </div>
    `;
    card.querySelector('.img-del').onclick = ()=>{
      ep.images = ep.images.filter(x=>x.id!==img.id);
      renderImages(ep);
      saveNow();
    };
    const cap = card.querySelector('.img-caption');
    cap.oninput = ()=>{ img.caption = cap.value; scheduleSave(); };
    cap.onblur = saveNow;
    grid.appendChild(card);
  });
}
 
/* image upload handlers (episode gallery + character avatar) */
document.getElementById('hiddenImgInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const ep = getEpisode(currentSeriesId, currentSeasonId, currentEpisodeId);
  const reader = new FileReader();
  reader.onload = ()=>{
    ep.images.push({id:uid(), dataUrl:reader.result, caption:''});
    renderImages(ep);
    saveNow();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});
 
document.getElementById('hiddenCharImgInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file || !pendingCharPhotoId) return;
  const ep = getEpisode(currentSeriesId, currentSeasonId, currentEpisodeId);
  const c = ep.characters.find(x=>x.id===pendingCharPhotoId);
  const reader = new FileReader();
  reader.onload = ()=>{
    if(c){ c.photo = reader.result; renderChars(ep); saveNow(); }
    pendingCharPhotoId = null;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});
 
/* ================= UTIL ================= */
function countWords(text){
  const t = text.trim();
  return t ? t.split(/\s+/).length : 0;
}
function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}
function exportEpisode(ep){
  const blob = new Blob([`${ep.title || 'İsimsiz Bölüm'}\n\n${ep.script}`], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(ep.title||'bolum').replace(/[^\w\-ğüşıöçĞÜŞİÖÇ ]/g,'').trim() || 'bolum'}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
 
function render(){ renderTree(); renderMain(); }
 
function updateClock(){
  const el = document.getElementById('clock');
  const now = new Date();
  el.textContent = now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateClock, 1000*30);
updateClock();
 
/* ================= AMBIENCE + SPLASH ================= */
function spawnStars(){
  const wrap = document.getElementById('bgStars');
  const count = 46;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'bg-star';
    s.style.left = (Math.random()*100) + '%';
    s.style.top = (Math.random()*100) + '%';
    s.style.animationDelay = (Math.random()*5) + 's';
    s.style.animationDuration = (3 + Math.random()*4) + 's';
    wrap.appendChild(s);
  }
}
spawnStars();
 
function hideSplash(){
  const splash = document.getElementById('splash');
  if(!splash) return;
  splash.classList.add('hide');
  setTimeout(()=>splash.remove(), 700);
}
 
const splashStart = Date.now();
loadData().then(()=>{
  const elapsed = Date.now() - splashStart;
  const remain = Math.max(0, 1400 - elapsed);
  setTimeout(hideSplash, remain);
});
document.getElementById('splash').addEventListener('click', hideSplash);
</script>
</body>
</html>
